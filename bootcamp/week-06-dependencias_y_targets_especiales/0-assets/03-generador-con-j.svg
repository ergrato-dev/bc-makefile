<svg viewBox="0 0 920 450" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Con make -j4, la regla con : lanza el generador dos veces; con &amp;: una sola</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f85149"/>
    </marker>
    <style>.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}</style>
  </defs>
  <rect width="920" height="450" fill="#0d1117"/>

  <g font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14" fill="#f0f6fc">
    <!-- Participantes -->
    <g text-anchor="middle">
      <rect x="40" y="20" width="160" height="40" rx="6" fill="#161b22" stroke="#f78166" stroke-width="2"/>
      <text x="120" y="45" class="m">make -j4</text>
      <rect x="330" y="20" width="180" height="40" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
      <text x="420" y="45">generador (job 1)</text>
      <rect x="710" y="20" width="180" height="40" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
      <text x="800" y="45">generador (job 2)</text>
    </g>
    <g stroke="#30363d" stroke-width="2" stroke-dasharray="4 4">
      <line x1="120" y1="60" x2="120" y2="430"/>
      <line x1="420" y1="60" x2="420" y2="430"/>
      <line x1="800" y1="60" x2="800" y2="430"/>
    </g>

    <!-- Caso 1: dos reglas independientes -->
    <rect x="40" y="76" width="850" height="30" rx="4" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
    <text x="465" y="96" text-anchor="middle">Regla <tspan class="m">a.c a.h : def</tspan> (dos reglas independientes)</text>

    <line x1="120" y1="140" x2="418" y2="140" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="135" y="132" font-size="13">construir <tspan class="m">a.c</tspan></text>
    <line x1="120" y1="175" x2="798" y2="175" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="785" y="167" font-size="13" text-anchor="end">construir <tspan class="m">a.h</tspan></text>
    <line x1="420" y1="210" x2="122" y2="210" stroke="#8b949e" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
    <text x="135" y="202" font-size="13">escribe <tspan class="m">a.c</tspan> y <tspan class="m">a.h</tspan></text>
    <line x1="800" y1="245" x2="122" y2="245" stroke="#f85149" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-red)"/>
    <text x="785" y="237" font-size="13" fill="#f85149" text-anchor="end">escribe <tspan class="m">a.c</tspan> y <tspan class="m">a.h</tspan> otra vez, a la vez</text>

    <!-- Caso 2: grouped target -->
    <rect x="40" y="268" width="850" height="30" rx="4" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
    <text x="465" y="288" text-anchor="middle">Regla <tspan class="m">a.c a.h &amp;: def</tspan> (grouped target)</text>

    <line x1="120" y1="330" x2="418" y2="330" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="135" y="322" font-size="13">construir <tspan class="m">a.c</tspan> y <tspan class="m">a.h</tspan></text>
    <line x1="420" y1="365" x2="122" y2="365" stroke="#8b949e" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
    <text x="135" y="357" font-size="13">escribe <tspan class="m">a.c</tspan> y <tspan class="m">a.h</tspan></text>

    <rect x="40" y="386" width="850" height="30" rx="4" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
    <text x="465" y="406" text-anchor="middle"><tspan class="m">a.h</tspan> ya está hecho: no lanza otro job</text>
  </g>
</svg>
