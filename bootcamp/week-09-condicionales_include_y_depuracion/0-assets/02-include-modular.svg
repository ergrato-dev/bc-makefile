<svg viewBox="0 0 800 440" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>El Makefile principal carga módulos con include y un local.mk opcional con -include</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
  </defs>
  <rect width="800" height="440" fill="#0d1117"/>

  <g font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14">
    <rect x="270" y="24" width="260" height="56" rx="6" fill="#161b22" stroke="#f78166" stroke-width="2"/>
    <text x="400" y="47" fill="#f0f6fc" text-anchor="middle">Makefile principal</text>
    <text x="400" y="67" fill="#8b949e" text-anchor="middle" font-size="12">orden de carga y .DEFAULT_GOAL</text>

    <path d="M400,80 V115 H140 V148 M400,115 H660 V148 M400,115 V148" fill="none" stroke="#8b949e" stroke-width="2"/>
    <line x1="140" y1="140" x2="140" y2="148" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="400" y1="140" x2="400" y2="148" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="660" y1="140" x2="660" y2="148" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- módulos -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      <rect x="30" y="150" width="220" height="56" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
      <text x="140" y="173" fill="#f0f6fc" text-anchor="middle">include mk/build.mk</text>
      <rect x="290" y="150" width="220" height="56" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
      <text x="400" y="173" fill="#f0f6fc" text-anchor="middle">include mk/test.mk</text>
      <rect x="550" y="150" width="220" height="56" rx="6" fill="#161b22" stroke="#d2a8ff"
            stroke-width="2" stroke-dasharray="6 4"/>
      <text x="660" y="173" fill="#f0f6fc" text-anchor="middle">-include mk/local.mk</text>
    </g>
    <text x="140" y="194" fill="#f85149" text-anchor="middle" font-size="12">si falta: error</text>
    <text x="400" y="194" fill="#f85149" text-anchor="middle" font-size="12">si falta: error</text>
    <text x="660" y="194" fill="#8b949e" text-anchor="middle" font-size="12">si falta: se ignora</text>

    <line x1="140" y1="206" x2="140" y2="258" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="400" y1="206" x2="400" y2="258" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="660" y1="206" x2="660" y2="258" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- targets que aporta cada módulo -->
    <rect x="30" y="260" width="220" height="56" rx="6" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="140" y="283" fill="#f0f6fc" text-anchor="middle"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace">build compile link</text>
    <text x="140" y="304" fill="#8b949e" text-anchor="middle" font-size="12">targets</text>
    <rect x="290" y="260" width="220" height="56" rx="6" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="400" y="283" fill="#f0f6fc" text-anchor="middle"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace">test coverage bench</text>
    <text x="400" y="304" fill="#8b949e" text-anchor="middle" font-size="12">targets</text>
    <rect x="550" y="260" width="220" height="56" rx="6" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="660" y="283" fill="#f0f6fc" text-anchor="middle">overrides locales</text>
    <text x="660" y="304" fill="#8b949e" text-anchor="middle" font-size="12">no se versiona en git</text>

    <path d="M140,316 V350 H660 V316 M400,316 V350" fill="none" stroke="#8b949e" stroke-width="2"/>
    <line x1="400" y1="350" x2="400" y2="376" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="320" y="378" width="160" height="44" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
    <text x="400" y="405" fill="#f0f6fc" text-anchor="middle"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace">make all</text>
  </g>
</svg>
