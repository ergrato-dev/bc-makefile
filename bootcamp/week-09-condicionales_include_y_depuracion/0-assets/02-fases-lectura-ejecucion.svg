<svg viewBox="0 0 800 670" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Make lee todo el Makefile, rehace los incluidos desactualizados y solo después ejecuta recetas</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
    <marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e3b341"/>
    </marker>
  </defs>
  <rect width="800" height="670" fill="#0d1117"/>

  <g font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14">
    <rect x="330" y="20" width="140" height="40" rx="6" fill="#161b22" stroke="#f78166" stroke-width="2"/>
    <text x="400" y="45" fill="#f0f6fc" text-anchor="middle"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace">make target</text>
    <line x1="400" y1="60" x2="400" y2="84" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="250" y="86" width="300" height="44" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="400" y="113" fill="#f0f6fc" text-anchor="middle" font-weight="600">Fase 1: lectura del Makefile</text>

    <path d="M400,130 V150 H110 V166 M400,150 H650 V166 M270,150 V166 M440,150 V166" fill="none" stroke="#8b949e" stroke-width="2"/>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      <rect x="35" y="168" width="150" height="56" rx="6" fill="#161b22" stroke="#30363d" stroke-width="2"/>
      <text x="110" y="191" fill="#f0f6fc" text-anchor="middle">:=  ?=  +=</text>
      <rect x="195" y="168" width="150" height="56" rx="6" fill="#161b22" stroke="#30363d" stroke-width="2"/>
      <text x="270" y="191" fill="#f0f6fc" text-anchor="middle">ifeq / ifdef</text>
      <rect x="355" y="168" width="170" height="56" rx="6" fill="#161b22" stroke="#30363d" stroke-width="2"/>
      <text x="440" y="191" fill="#f0f6fc" text-anchor="middle">include</text>
      <rect x="535" y="168" width="230" height="56" rx="6" fill="#161b22" stroke="#30363d" stroke-width="2"/>
      <text x="650" y="191" fill="#f0f6fc" text-anchor="middle" font-size="13">$(info) $(warning) $(error)</text>
    </g>
    <g font-size="12" fill="#8b949e" text-anchor="middle">
      <text x="110" y="212">asignaciones</text>
      <text x="270" y="212">se evalúan aquí</text>
      <text x="440" y="212">y -include</text>
      <text x="650" y="212">a nivel de archivo</text>
    </g>

    <line x1="440" y1="224" x2="440" y2="258" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="300" y="260" width="280" height="56" rx="28" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
    <text x="440" y="284" fill="#f0f6fc" text-anchor="middle">¿Algún incluido desactualizado</text>
    <text x="440" y="303" fill="#f0f6fc" text-anchor="middle">y con regla?</text>

    <line x1="580" y1="288" x2="608" y2="288" stroke="#e3b341" stroke-width="2" marker-end="url(#arrow-warn)"/>
    <text x="594" y="280" fill="#e3b341" font-size="12" text-anchor="middle">sí</text>
    <rect x="610" y="260" width="170" height="56" rx="6" fill="#161b22" stroke="#e3b341" stroke-width="2"/>
    <text x="695" y="284" fill="#f0f6fc" text-anchor="middle">Rehacerlo y</text>
    <text x="695" y="303" fill="#f0f6fc" text-anchor="middle">releer todo</text>
    <path d="M780,288 H790 V108 H552" fill="none" stroke="#e3b341" stroke-width="2" marker-end="url(#arrow-warn)"/>

    <line x1="440" y1="316" x2="440" y2="354" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="448" y="340" fill="#8b949e" font-size="12">no</text>

    <rect x="290" y="356" width="300" height="44" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="440" y="383" fill="#f0f6fc" text-anchor="middle" font-weight="600">Fase 2: ejecución</text>
    <line x1="440" y1="400" x2="440" y2="428" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="290" y="430" width="300" height="56" rx="6" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="440" y="453" fill="#f0f6fc" text-anchor="middle">Decidir qué targets rehacer</text>
    <text x="440" y="474" fill="#8b949e" text-anchor="middle" font-size="12"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace">--debug, --trace</text>
    <line x1="440" y1="486" x2="440" y2="514" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="260" y="516" width="360" height="56" rx="6" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="440" y="539" fill="#f0f6fc" text-anchor="middle">Expandir la receta</text>
    <text x="440" y="560" fill="#8b949e" text-anchor="middle" font-size="12">variables de target, $(info) y $(error) de receta</text>
    <text x="245" y="538" fill="#e3b341" font-size="12" text-anchor="end">make -n también llega aquí:</text>
    <text x="245" y="556" fill="#e3b341" font-size="12" text-anchor="end">$(info) se imprime</text>
    <line x1="440" y1="572" x2="440" y2="600" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="290" y="602" width="300" height="44" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
    <text x="440" y="629" fill="#f0f6fc" text-anchor="middle">Ejecutar los comandos en el shell</text>
  </g>
</svg>
