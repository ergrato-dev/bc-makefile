<svg viewBox="0 0 800 470" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>El Make raíz lanza un sub-make por módulo con $(MAKE) -C y espera su código de salida</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
    <marker id="arrow-ok" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/>
    </marker>
  </defs>
  <rect width="800" height="470" fill="#0d1117"/>

  <g font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14">
    <!-- participantes -->
    <rect x="20" y="20" width="180" height="44" rx="6" fill="#161b22" stroke="#f78166" stroke-width="2"/>
    <text x="110" y="47" fill="#f0f6fc" text-anchor="middle">Make raíz</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
      <rect x="220" y="20" width="180" height="44" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
      <text x="310" y="46" fill="#f0f6fc" text-anchor="middle">make -C modulo-a</text>
      <rect x="410" y="20" width="180" height="44" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
      <text x="500" y="46" fill="#f0f6fc" text-anchor="middle">make -C modulo-b</text>
      <rect x="600" y="20" width="180" height="44" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
      <text x="690" y="46" fill="#f0f6fc" text-anchor="middle">make -C modulo-c</text>
    </g>

    <!-- líneas de vida -->
    <g stroke="#30363d" stroke-width="2" stroke-dasharray="4 4">
      <line x1="110" y1="64" x2="110" y2="370"/>
      <line x1="310" y1="64" x2="310" y2="370"/>
      <line x1="500" y1="64" x2="500" y2="370"/>
      <line x1="690" y1="64" x2="690" y2="370"/>
    </g>

    <!-- mensajes -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12"
       paint-order="stroke" stroke="#0d1117" stroke-width="4">
      <text x="210" y="102" fill="#79c0ff" text-anchor="middle">$(MAKE) -C modulo-a build</text>
      <text x="305" y="182" fill="#79c0ff" text-anchor="middle">$(MAKE) -C modulo-b build</text>
      <text x="400" y="262" fill="#79c0ff" text-anchor="middle">$(MAKE) -C modulo-c build</text>
      <text x="210" y="137" fill="#3fb950" text-anchor="middle">exit 0</text>
      <text x="305" y="217" fill="#3fb950" text-anchor="middle">exit 0</text>
      <text x="400" y="297" fill="#3fb950" text-anchor="middle">exit 0</text>
    </g>
    <line x1="110" y1="110" x2="308" y2="110" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="310" y1="145" x2="112" y2="145" stroke="#3fb950" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-ok)"/>
    <line x1="110" y1="190" x2="498" y2="190" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="500" y1="225" x2="112" y2="225" stroke="#3fb950" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-ok)"/>
    <line x1="110" y1="270" x2="688" y2="270" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="690" y1="305" x2="112" y2="305" stroke="#3fb950" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-ok)"/>

    <rect x="30" y="330" width="160" height="36" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
    <text x="110" y="353" fill="#f0f6fc" text-anchor="middle">all completado</text>

    <!-- qué variables llegan -->
    <rect x="20" y="390" width="760" height="60" rx="6" fill="#161b22" stroke="#e3b341" stroke-width="1.5"/>
    <text x="36" y="415" fill="#f0f6fc" font-size="13">Al sub-make solo llegan la línea de comandos (vía MAKEFLAGS), el entorno y lo exportado por nombre.</text>
    <text x="36" y="436" fill="#8b949e" font-size="13">Lo que define el Makefile padre hay que pasarlo explícitamente:
      <tspan fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ENV=$(ENV)</tspan></text>
  </g>
</svg>
