<svg viewBox="0 0 800 640" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Condicionales: ifeq compara valores, ifdef comprueba si hay valor, y ambos se deciden en la fase de lectura</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
  </defs>
  <rect width="800" height="640" fill="#0d1117"/>

  <g font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14">
    <!-- Fase 1 -->
    <rect x="20" y="20" width="760" height="496" rx="10" fill="none"
          stroke="#30363d" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="36" y="44" fill="#8b949e" font-size="13">Fase 1 · lectura del Makefile</text>

    <rect x="300" y="50" width="200" height="44" rx="6" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="400" y="77" fill="#f0f6fc" text-anchor="middle">Make evalúa variable</text>
    <line x1="400" y1="94" x2="400" y2="122" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="290" y="124" width="220" height="44" rx="22" fill="#161b22" stroke="#f78166" stroke-width="2"/>
    <text x="400" y="151" fill="#f0f6fc" text-anchor="middle">¿Tipo de condicional?</text>

    <path d="M400,168 V184 H250 V198" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M400,184 H550 V198" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="150" y="200" width="200" height="56" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="250" y="224" fill="#f0f6fc" text-anchor="middle"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ifeq / ifneq</text>
    <text x="250" y="244" fill="#8b949e" text-anchor="middle" font-size="12">compara valores</text>

    <rect x="450" y="200" width="200" height="56" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="550" y="224" fill="#f0f6fc" text-anchor="middle"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ifdef / ifndef</text>
    <text x="550" y="244" fill="#8b949e" text-anchor="middle" font-size="12">¿tiene valor no vacío?</text>

    <line x1="250" y1="256" x2="250" y2="288" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="550" y1="256" x2="550" y2="288" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="150" y="290" width="200" height="44" rx="22" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
    <text x="250" y="317" fill="#f0f6fc" text-anchor="middle">¿Valores iguales?</text>
    <rect x="450" y="290" width="200" height="44" rx="22" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
    <text x="550" y="317" fill="#f0f6fc" text-anchor="middle">¿Variable definida?</text>

    <!-- ramas -->
    <line x1="200" y1="334" x2="170" y2="378" stroke="#3fb950" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="174" y="360" fill="#3fb950" font-size="12" text-anchor="end">sí</text>
    <line x1="300" y1="334" x2="330" y2="378" stroke="#d2a8ff" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="326" y="360" fill="#d2a8ff" font-size="12">no</text>
    <line x1="500" y1="334" x2="470" y2="378" stroke="#3fb950" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="474" y="360" fill="#3fb950" font-size="12" text-anchor="end">sí</text>
    <line x1="600" y1="334" x2="630" y2="378" stroke="#d2a8ff" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="626" y="360" fill="#d2a8ff" font-size="12">no</text>

    <rect x="110" y="380" width="120" height="40" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
    <text x="170" y="405" fill="#f0f6fc" text-anchor="middle">rama then</text>
    <rect x="270" y="380" width="120" height="40" rx="6" fill="#161b22" stroke="#d2a8ff" stroke-width="2"/>
    <text x="330" y="405" fill="#f0f6fc" text-anchor="middle">rama else</text>
    <rect x="410" y="380" width="120" height="40" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
    <text x="470" y="405" fill="#f0f6fc" text-anchor="middle">rama then</text>
    <rect x="570" y="380" width="120" height="40" rx="6" fill="#161b22" stroke="#d2a8ff" stroke-width="2"/>
    <text x="630" y="405" fill="#f0f6fc" text-anchor="middle">rama else</text>

    <!-- las cuatro ramas confluyen -->
    <path d="M170,420 V436 H630 V420 M330,420 V436 M470,420 V436" fill="none" stroke="#8b949e" stroke-width="2"/>
    <line x1="400" y1="436" x2="400" y2="448" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="300" y="450" width="200" height="44" rx="6" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="400" y="477" fill="#f0f6fc" text-anchor="middle">Expansión de reglas</text>

    <!-- Fase 2 -->
    <rect x="20" y="536" width="760" height="84" rx="10" fill="none"
          stroke="#30363d" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="36" y="560" fill="#8b949e" font-size="13">Fase 2 · ejecución</text>

    <line x1="400" y1="494" x2="400" y2="554" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="300" y="556" width="200" height="44" rx="6" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="400" y="583" fill="#f0f6fc" text-anchor="middle">Make ejecuta receta</text>

    <text x="520" y="575" fill="#e3b341" font-size="12">el ifeq ya se decidió:</text>
    <text x="520" y="593" fill="#e3b341" font-size="12">no ve la salida de las recetas</text>
  </g>
</svg>
