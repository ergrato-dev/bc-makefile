<svg viewBox="0 0 800 480" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Precedencia de variables, de mayor a menor: override, línea de comandos, Makefile, entorno y ?=</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
    <style>.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}</style>
  </defs>
  <rect width="800" height="480" fill="#0d1117"/>

  <g font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14">
    <text x="400" y="36" font-size="20" font-weight="bold" fill="#f0f6fc" text-anchor="middle">Precedencia: quién gana cuando hay conflicto</text>

    <!-- cajas -->
    <g fill="#161b22" stroke-width="2">
      <rect x="140" y="64" width="520" height="56" rx="6" stroke="#f78166"/>
      <rect x="140" y="148" width="520" height="56" rx="6" stroke="#58a6ff"/>
      <rect x="140" y="232" width="520" height="56" rx="6" stroke="#58a6ff"/>
      <rect x="140" y="316" width="520" height="56" rx="6" stroke="#58a6ff"/>
      <rect x="140" y="400" width="520" height="56" rx="6" stroke="#30363d"/>
    </g>
    <g font-size="22" font-weight="bold" fill="#8b949e" text-anchor="middle">
      <text x="176" y="100" fill="#f78166">1</text>
      <text x="176" y="184">2</text>
      <text x="176" y="268">3</text>
      <text x="176" y="352">4</text>
      <text x="176" y="436">5</text>
    </g>
    <g class="m" fill="#f0f6fc">
      <text x="210" y="88">override VAR := x</text>
      <text x="210" y="172">make VAR=x</text>
      <text x="210" y="256">VAR = x · VAR := x · VAR != cmd</text>
      <text x="210" y="340">VAR=x make <tspan font-family="Inter, system-ui, -apple-system, sans-serif" fill="#8b949e">(entorno)</tspan></text>
      <text x="210" y="424">VAR ?= x <tspan font-family="Inter, system-ui, -apple-system, sans-serif" fill="#8b949e">solo si nadie la definió antes</tspan></text>
    </g>
    <g font-size="13" fill="#8b949e">
      <text x="210" y="109"><tspan class="m">$(origin VAR)</tspan> = <tspan class="m" fill="#d2a8ff">override</tspan></text>
      <text x="210" y="193"><tspan class="m">$(origin VAR)</tspan> = <tspan class="m" fill="#d2a8ff">command line</tspan></text>
      <text x="210" y="277"><tspan class="m">$(origin VAR)</tspan> = <tspan class="m" fill="#d2a8ff">file</tspan></text>
      <text x="210" y="361"><tspan class="m">$(origin VAR)</tspan> = <tspan class="m" fill="#d2a8ff">environment</tspan></text>
      <text x="210" y="445"><tspan class="m">$(origin VAR)</tspan> = <tspan class="m" fill="#d2a8ff">file</tspan></text>
    </g>

    <!-- gana a -->
    <g stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)">
      <line x1="400" y1="120" x2="400" y2="146"/>
      <line x1="400" y1="204" x2="400" y2="230"/>
      <line x1="400" y1="288" x2="400" y2="314"/>
      <line x1="400" y1="372" x2="400" y2="398"/>
    </g>
    <g font-size="12" fill="#8b949e">
      <text x="412" y="138">gana a</text>
      <text x="412" y="222">gana a</text>
      <text x="412" y="306">gana a</text>
      <text x="412" y="390">gana a</text>
    </g>

    <!-- aviso 3 y 4 -->
    <path d="M672,262 H684 V342 H672" fill="none" stroke="#e3b341" stroke-width="2"/>
    <g font-size="13" fill="#e3b341">
      <text x="694" y="284">el entorno</text>
      <text x="694" y="302">pierde ante</text>
      <text x="694" y="320">el Makefile</text>
      <text x="694" y="344" font-size="12" fill="#8b949e"><tspan class="m">make -e</tspan> los</text>
      <text x="694" y="360" font-size="12" fill="#8b949e">invierte</text>
    </g>
  </g>
</svg>
