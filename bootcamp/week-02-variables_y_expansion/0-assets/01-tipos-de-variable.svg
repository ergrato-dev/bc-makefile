<svg viewBox="0 0 800 430" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Los cinco operadores de asignación: cuándo se expande el valor y qué tipo de variable crea cada uno</title>
  <defs>
    <style>.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}</style>
  </defs>
  <rect width="800" height="430" fill="#0d1117"/>

  <g font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14">
    <text x="400" y="36" font-size="20" font-weight="bold" fill="#f0f6fc" text-anchor="middle">Operadores de asignación: cuándo se expande el valor</text>

    <!-- cabecera -->
    <g font-size="13" fill="#8b949e" text-anchor="middle">
      <text x="80" y="82">operador</text>
      <text x="290" y="82">comportamiento</text>
      <text x="530" y="82">al asignar</text>
      <text x="630" y="82">al usar</text>
      <text x="730" y="82"><tspan class="m">$(flavor)</tspan></text>
    </g>

    <!-- filas -->
    <g fill="#161b22" stroke="#30363d" stroke-width="1.5">
      <rect x="30" y="96" width="740" height="56" rx="6"/>
      <rect x="30" y="160" width="740" height="56" rx="6" stroke="#3fb950" stroke-width="2"/>
      <rect x="30" y="224" width="740" height="56" rx="6"/>
      <rect x="30" y="288" width="740" height="56" rx="6"/>
      <rect x="30" y="352" width="740" height="56" rx="6"/>
    </g>
    <g stroke="#30363d" stroke-dasharray="4 4">
      <line x1="480" y1="96" x2="480" y2="408"/>
      <line x1="580" y1="96" x2="580" y2="408"/>
      <line x1="680" y1="96" x2="680" y2="408"/>
    </g>

    <g class="m" font-size="20" font-weight="bold" fill="#f78166" text-anchor="middle">
      <text x="80" y="131">=</text>
      <text x="80" y="195">:=</text>
      <text x="80" y="259">?=</text>
      <text x="80" y="323">+=</text>
      <text x="80" y="387">!=</text>
    </g>

    <g fill="#f0f6fc">
      <text x="140" y="119">Recursiva (lazy)</text>
      <text x="140" y="183">Simple (inmediata) <tspan font-size="12" fill="#3fb950">· default recomendado</tspan></text>
      <text x="140" y="247">Condicional</text>
      <text x="140" y="311">Append</text>
      <text x="140" y="375">Shell</text>
    </g>
    <g font-size="13" fill="#8b949e">
      <text x="140" y="140">se expande cada vez que se usa la variable</text>
      <text x="140" y="204">se expande una sola vez, al asignar</text>
      <text x="140" y="268">solo asigna si la variable no está definida</text>
      <text x="140" y="332">agrega al valor existente, separado por espacio</text>
      <text x="140" y="396">ejecuta el comando al asignar; guarda su salida</text>
    </g>

    <!-- cuándo se expande -->
    <g fill="#58a6ff">
      <circle cx="630" cy="124" r="7"/>
      <circle cx="530" cy="188" r="7"/>
      <circle cx="630" cy="252" r="7"/>
      <circle cx="530" cy="380" r="7"/>
    </g>
    <text x="580" y="321" font-size="13" fill="#8b949e" text-anchor="middle">como el original</text>

    <g class="m" font-size="13" text-anchor="middle">
      <text x="730" y="129" fill="#d2a8ff">recursive</text>
      <text x="730" y="193" fill="#3fb950">simple</text>
      <text x="730" y="257" fill="#d2a8ff">recursive</text>
      <text x="730" y="321" fill="#8b949e" font-family="Inter, system-ui, -apple-system, sans-serif">hereda</text>
      <text x="730" y="385" fill="#d2a8ff">recursive</text>
    </g>
  </g>
</svg>
