<svg viewBox="0 0 1020 470" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Qué función avanzada usar según lo que necesitas y qué produce cada una</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
    <style>.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}</style>
  </defs>
  <rect width="1020" height="470" fill="#0d1117"/>

  <g font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14" fill="#f0f6fc" text-anchor="middle">
    <rect x="410" y="20" width="200" height="40" rx="6" fill="#161b22" stroke="#f78166" stroke-width="2"/>
    <text x="510" y="45" font-size="14">¿Qué necesitas?</text>
    <line x1="510" y1="60" x2="135" y2="98" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="20" y="100" width="230" height="80" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="135" y="125" font-size="14">Generar una lista de</text>
    <text x="135" y="145" font-size="14">strings a partir de</text>
    <text x="135" y="165" font-size="14">otra lista</text>
    <line x1="135" y1="180" x2="135" y2="218" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="20" y="220" width="230" height="110" rx="6" fill="#161b22" stroke="#f78166" stroke-width="2"/>
    <text x="135" y="247" font-size="13" class="m">$(foreach var,list,text)</text>
    <text x="135" y="269" font-size="13" fill="#8b949e">ejemplo:</text>
    <text x="135" y="291" font-size="13" class="m" fill="#79c0ff">$(foreach m,auth logger,</text>
    <text x="135" y="313" font-size="13" class="m" fill="#79c0ff">build/$(m).o)</text>
    <line x1="135" y1="330" x2="135" y2="368" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="20" y="370" width="230" height="76" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
    <text x="135" y="393" font-size="14" fill="#8b949e">String:</text>
    <text x="135" y="413" font-size="14" class="m">build/auth.o</text>
    <text x="135" y="433" font-size="14" class="m">build/logger.o</text>
    <line x1="510" y1="60" x2="385" y2="98" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="270" y="100" width="230" height="80" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="385" y="125" font-size="14">Reutilizar un bloque</text>
    <text x="385" y="145" font-size="14">de código con</text>
    <text x="385" y="165" font-size="14">distintos parámetros</text>
    <line x1="385" y1="180" x2="385" y2="218" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="270" y="220" width="230" height="110" rx="6" fill="#161b22" stroke="#f78166" stroke-width="2"/>
    <text x="385" y="247" font-size="13" class="m">define fn</text>
    <text x="385" y="269" font-size="13" class="m">...</text>
    <text x="385" y="291" font-size="13" class="m">endef</text>
    <text x="385" y="313" font-size="13" class="m" fill="#79c0ff">$(call fn,arg1,arg2)</text>
    <line x1="385" y1="330" x2="385" y2="368" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="270" y="370" width="230" height="76" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
    <text x="385" y="403" font-size="14">Plantilla expandida</text>
    <text x="385" y="423" font-size="14" fill="#8b949e">con $1, $2...</text>
    <line x1="510" y1="60" x2="635" y2="98" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="520" y="100" width="230" height="80" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="635" y="125" font-size="14">Crear una regla Make</text>
    <text x="635" y="145" font-size="14">con prerrequisitos</text>
    <text x="635" y="165" font-size="14">y receta reales</text>
    <line x1="635" y1="180" x2="635" y2="218" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="520" y="220" width="230" height="110" rx="6" fill="#161b22" stroke="#f78166" stroke-width="2"/>
    <text x="635" y="258" font-size="13" class="m">$(eval texto_makefile)</text>
    <text x="635" y="280" font-size="13" fill="#8b949e">normalmente con</text>
    <text x="635" y="302" font-size="13" fill="#8b949e">call + foreach</text>
    <line x1="635" y1="330" x2="635" y2="368" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="520" y="370" width="230" height="76" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
    <text x="635" y="403" font-size="14">Nueva regla o variable</text>
    <text x="635" y="423" font-size="14" fill="#8b949e">en memoria de Make</text>
    <line x1="510" y1="60" x2="885" y2="98" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="770" y="100" width="230" height="80" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="885" y="125" font-size="14">Obtener datos del</text>
    <text x="885" y="145" font-size="14">sistema en tiempo</text>
    <text x="885" y="165" font-size="14">de carga</text>
    <line x1="885" y1="180" x2="885" y2="218" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="770" y="220" width="230" height="110" rx="6" fill="#161b22" stroke="#f78166" stroke-width="2"/>
    <text x="885" y="247" font-size="13" class="m">$(shell comando)</text>
    <text x="885" y="269" font-size="13" fill="#8b949e">ejemplo:</text>
    <text x="885" y="291" font-size="13" class="m" fill="#79c0ff">$(shell git rev-parse</text>
    <text x="885" y="313" font-size="13" class="m" fill="#79c0ff">--short HEAD)</text>
    <line x1="885" y1="330" x2="885" y2="368" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="770" y="370" width="230" height="76" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
    <text x="885" y="403" font-size="14">stdout del comando</text>
    <text x="885" y="423" font-size="14" fill="#8b949e">como string Make</text>
  </g>
</svg>
