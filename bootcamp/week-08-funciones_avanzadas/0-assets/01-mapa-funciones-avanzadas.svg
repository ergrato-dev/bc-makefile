<svg viewBox="0 0 760 370" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Las cuatro funciones avanzadas y cómo se alimentan: shell da datos, foreach y call producen texto, eval lo convierte en reglas</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
    <style>.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}</style>
  </defs>
  <rect width="760" height="370" fill="#0d1117"/>

  <g font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14" fill="#f0f6fc">
    <text x="380" y="40" text-anchor="middle" font-size="16" font-weight="600">Funciones avanzadas de Make</text>

    <!-- shell -->
    <rect x="20" y="70" width="300" height="96" rx="6" fill="#161b22" stroke="#d2a8ff" stroke-width="2"/>
    <text x="36" y="98" class="m" font-size="15" fill="#d2a8ff">$(shell)</text>
    <text x="36" y="124" font-size="13">Ejecuta un comando en el shell</text>
    <text x="36" y="146" font-size="13" fill="#8b949e">Captura stdout como string</text>

    <!-- foreach -->
    <rect x="440" y="70" width="300" height="96" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="456" y="98" class="m" font-size="15" fill="#58a6ff">$(foreach)</text>
    <text x="456" y="124" font-size="13">Itera una lista y expande texto</text>
    <text x="456" y="146" font-size="13" fill="#8b949e">Resultado: string concatenado</text>

    <!-- call -->
    <rect x="20" y="250" width="300" height="96" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="36" y="278" class="m" font-size="15" fill="#58a6ff">$(call)</text>
    <text x="36" y="304" font-size="13">Llama una función definida por ti</text>
    <text x="36" y="326" font-size="13" fill="#8b949e">Argumentos: <tspan class="m">$1 $2 $3...</tspan></text>

    <!-- eval -->
    <rect x="440" y="250" width="300" height="96" rx="6" fill="#161b22" stroke="#f78166" stroke-width="2"/>
    <text x="456" y="278" class="m" font-size="15" fill="#f78166">$(eval)</text>
    <text x="456" y="304" font-size="13">Parsea texto como sintaxis Makefile</text>
    <text x="456" y="326" font-size="13" fill="#8b949e">Crea reglas y variables al cargar</text>

    <!-- Relaciones -->
    <line x1="320" y1="118" x2="438" y2="118" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="379" y="94" fill="#8b949e" font-size="13" text-anchor="middle">datos del</text>
    <text x="379" y="110" fill="#8b949e" font-size="13" text-anchor="middle">sistema</text>

    <line x1="590" y1="166" x2="590" y2="248" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="602" y="212" fill="#8b949e" font-size="13">genera texto</text>

    <line x1="320" y1="298" x2="438" y2="298" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="379" y="274" fill="#8b949e" font-size="13" text-anchor="middle">produce</text>
    <text x="379" y="290" fill="#8b949e" font-size="13" text-anchor="middle">texto</text>
  </g>
</svg>
