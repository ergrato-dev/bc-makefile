<svg viewBox="0 0 1080 550" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Secuencia foreach, call y eval: una plantilla se instancia como regla real por cada servicio</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
    <style>.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}</style>
  </defs>
  <rect width="1080" height="550" fill="#0d1117"/>

  <g font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14" fill="#f0f6fc">
    <!-- Participantes -->
    <g text-anchor="middle">
      <rect x="20" y="20" width="160" height="40" rx="6" fill="#161b22" stroke="#30363d" stroke-width="2"/>
      <text x="100" y="45">Makefile (lectura)</text>
      <rect x="235" y="20" width="150" height="40" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
      <text x="310" y="45" class="m">$(foreach)</text>
      <rect x="445" y="20" width="150" height="40" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
      <text x="520" y="45" class="m">$(call)</text>
      <rect x="655" y="20" width="150" height="40" rx="6" fill="#161b22" stroke="#f78166" stroke-width="2"/>
      <text x="730" y="45" class="m">$(eval)</text>
      <rect x="860" y="20" width="160" height="40" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
      <text x="940" y="45">Reglas de Make</text>
    </g>
    <g stroke="#30363d" stroke-width="2" stroke-dasharray="4 4">
      <line x1="100" y1="60" x2="100" y2="530"/>
      <line x1="310" y1="60" x2="310" y2="530"/>
      <line x1="520" y1="60" x2="520" y2="530"/>
      <line x1="730" y1="60" x2="730" y2="530"/>
      <line x1="940" y1="60" x2="940" y2="530"/>
    </g>

    <!-- 1. foreach -->
    <line x1="100" y1="100" x2="308" y2="100" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="110" y="78" width="252" height="16" fill="#0d1117"/>
    <text x="114" y="91" class="m" font-size="13">$(foreach svc,api worker,...)</text>

    <!-- Bucle -->
    <rect x="200" y="122" width="870" height="350" rx="6" fill="none" stroke="#d2a8ff" stroke-width="1.5"/>
    <rect x="200" y="122" width="150" height="24" rx="4" fill="#161b22" stroke="#d2a8ff" stroke-width="1.5"/>
    <text x="275" y="139" font-size="13" fill="#d2a8ff" text-anchor="middle">para cada svc</text>

    <!-- 2. call -->
    <line x1="310" y1="170" x2="518" y2="170" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="316" y="162" class="m" font-size="13">$(call SERVICE_RULE,api)</text>

    <!-- Nota sobre call -->
    <rect x="420" y="186" width="200" height="98" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="434" y="206" font-size="13" fill="#8b949e">Expande la plantilla:</text>
    <g class="m" font-size="13">
      <text x="434" y="228">$1 vale api</text>
      <text x="434" y="250">$$&lt; queda $&lt;</text>
      <text x="434" y="272">$$@ queda $@</text>
    </g>

    <!-- 3. texto a eval -->
    <line x1="520" y1="316" x2="728" y2="316" stroke="#8b949e" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
    <text x="530" y="308" font-size="13">texto de la regla para api</text>

    <!-- 4. eval parsea -->
    <line x1="730" y1="352" x2="938" y2="352" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="740" y="344" font-size="13">parsea como sintaxis Make</text>

    <!-- Nota sobre reglas -->
    <rect x="820" y="366" width="240" height="92" rx="4" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
    <text x="834" y="386" font-size="13" fill="#8b949e">Nueva regla disponible:</text>
    <g class="m" font-size="13">
      <text x="834" y="410">api: services/api/main.c</text>
      <text x="866" y="434">gcc $&lt; -o $@</text>
    </g>

    <!-- 5. vuelta a la lectura -->
    <line x1="940" y1="500" x2="102" y2="500" stroke="#8b949e" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
    <rect x="110" y="479" width="236" height="16" fill="#0d1117"/>
    <text x="114" y="492" font-size="13">los targets api y worker ya existen</text>
  </g>
</svg>
