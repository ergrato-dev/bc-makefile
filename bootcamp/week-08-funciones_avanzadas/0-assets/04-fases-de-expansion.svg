<svg viewBox="0 0 1000 400" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Fase de lectura frente a fase de ejecución: cuándo se expande cada función</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
    <style>.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}</style>
  </defs>
  <rect width="1000" height="400" fill="#0d1117"/>

  <g font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14" fill="#f0f6fc">
    <!-- Fase 1 -->
    <rect x="20" y="20" width="420" height="360" rx="8" fill="none" stroke="#30363d" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="40" y="46" font-weight="600">Fase 1: lectura del Makefile</text>
    <text x="40" y="68" font-size="13" fill="#8b949e">siempre, incluso con <tspan class="m">make -n</tspan> o <tspan class="m">make help</tspan></text>

    <rect x="40" y="90" width="380" height="60" rx="6" fill="#161b22" stroke="#e3b341" stroke-width="2"/>
    <text x="56" y="114" class="m">VAR := $(shell ...)</text>
    <text x="56" y="136" font-size="13" fill="#8b949e">se ejecuta una vez, al leer</text>

    <rect x="40" y="180" width="380" height="60" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="56" y="204" class="m">$(eval $(call PLANTILLA,x))</text>
    <text x="56" y="226" font-size="13" fill="#8b949e">crea reglas nuevas</text>

    <rect x="40" y="270" width="380" height="60" rx="6" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="56" y="294" class="m">VAR = $(shell ...)</text>
    <text x="56" y="316" font-size="13" fill="#8b949e">todavía no se ejecuta</text>

    <!-- Fase 2 -->
    <rect x="600" y="20" width="380" height="360" rx="8" fill="none" stroke="#30363d" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="620" y="46" font-weight="600">Fase 2: ejecución del target pedido</text>

    <rect x="620" y="110" width="340" height="80" rx="6" fill="#161b22" stroke="#f78166" stroke-width="2"/>
    <text x="790" y="142" text-anchor="middle">Make expande la receta entera</text>
    <text x="790" y="168" text-anchor="middle" class="m" font-size="13">$(file ...), $(info ...), $(VAR)</text>

    <line x1="790" y1="190" x2="790" y2="258" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="620" y="260" width="340" height="70" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
    <text x="790" y="290" text-anchor="middle">El shell ejecuta las líneas</text>
    <text x="790" y="313" text-anchor="middle" font-size="13" fill="#8b949e">se omite con <tspan class="m">make -n</tspan></text>

    <!-- Paso de fase -->
    <line x1="420" y1="120" x2="618" y2="140" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="420" y1="210" x2="618" y2="155" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="420" y1="300" x2="618" y2="178" stroke="#e3b341" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
    <text x="470" y="306" font-size="13" fill="#e3b341"><tspan class="m">$(shell)</tspan> en cada</text>
    <text x="470" y="323" font-size="13" fill="#e3b341">referencia</text>
  </g>
</svg>
