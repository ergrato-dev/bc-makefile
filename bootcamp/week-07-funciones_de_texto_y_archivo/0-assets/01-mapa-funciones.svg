<svg viewBox="0 0 900 590" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Mapa de funciones de texto y archivo agrupadas por propósito</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
    <style>.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}</style>
  </defs>
  <rect width="900" height="590" fill="#0d1117"/>

  <g font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14" fill="#f0f6fc">
    <!-- Raíz y bus -->
    <rect x="300" y="20" width="300" height="44" rx="6" fill="#161b22" stroke="#f78166" stroke-width="2"/>
    <text x="450" y="47" text-anchor="middle">Funciones de texto y archivo</text>
    <g stroke="#8b949e" stroke-width="2" fill="none">
      <line x1="450" y1="64" x2="450" y2="100"/>
      <line x1="153" y1="100" x2="745" y2="100"/>
      <line x1="153" y1="100" x2="153" y2="128" marker-end="url(#arrow)"/>
      <line x1="449" y1="100" x2="449" y2="128" marker-end="url(#arrow)"/>
      <line x1="745" y1="100" x2="745" y2="128" marker-end="url(#arrow)"/>
      <line x1="301" y1="100" x2="301" y2="348" marker-end="url(#arrow)"/>
      <line x1="597" y1="100" x2="597" y2="348" marker-end="url(#arrow)"/>
    </g>

    <!-- Descubrimiento -->
    <rect x="20" y="130" width="266" height="180" rx="6" fill="#161b22" stroke="#f78166" stroke-width="2"/>
    <text x="34" y="156" font-weight="600" fill="#f78166">Descubrimiento</text>
    <text x="34" y="186" class="m">$(wildcard pat)</text>
    <text x="34" y="206" font-size="13" fill="#8b949e">lista archivos en disco:</text>
    <text x="34" y="224" font-size="13" fill="#8b949e">la única que mira el disco</text>

    <!-- Transformación -->
    <rect x="316" y="130" width="266" height="180" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="330" y="156" font-weight="600" fill="#58a6ff">Transformación</text>
    <text x="330" y="186" class="m">$(patsubst pat,rep,text)</text>
    <text x="330" y="204" font-size="13" fill="#8b949e">con comodín %</text>
    <text x="330" y="230" class="m">$(subst from,to,text)</text>
    <text x="330" y="248" font-size="13" fill="#8b949e">literal</text>
    <text x="330" y="274" class="m">$(addprefix pre,names)</text>
    <text x="330" y="296" class="m">$(addsuffix suf,names)</text>

    <!-- Filtrado -->
    <rect x="612" y="130" width="266" height="180" rx="6" fill="#161b22" stroke="#d2a8ff" stroke-width="2"/>
    <text x="626" y="156" font-weight="600" fill="#d2a8ff">Filtrado</text>
    <text x="626" y="186" class="m">$(filter pat,text)</text>
    <text x="626" y="204" font-size="13" fill="#8b949e">conserva coincidencias</text>
    <text x="626" y="230" class="m">$(filter-out pat,text)</text>
    <text x="626" y="248" font-size="13" fill="#8b949e">elimina coincidencias</text>

    <!-- Rutas -->
    <rect x="168" y="350" width="266" height="170" rx="6" fill="#161b22" stroke="#79c0ff" stroke-width="2"/>
    <text x="182" y="376" font-weight="600" fill="#79c0ff">Rutas</text>
    <text x="182" y="396" font-size="13" fill="#8b949e">sobre <tspan class="m">src/main.c</tspan>:</text>
    <g class="m">
      <text x="182" y="424">$(dir names)</text>
      <text x="420" y="424" text-anchor="end" fill="#3fb950">src/</text>
      <text x="182" y="448">$(notdir names)</text>
      <text x="420" y="448" text-anchor="end" fill="#3fb950">main.c</text>
      <text x="182" y="472">$(basename names)</text>
      <text x="420" y="472" text-anchor="end" fill="#3fb950">src/main</text>
      <text x="182" y="496">$(suffix names)</text>
      <text x="420" y="496" text-anchor="end" fill="#3fb950">.c</text>
    </g>

    <!-- Utilidades -->
    <rect x="464" y="350" width="266" height="220" rx="6" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="478" y="376" font-weight="600" fill="#8b949e">Utilidades</text>
    <text x="478" y="406" class="m">$(sort list)</text>
    <text x="478" y="424" font-size="13" fill="#8b949e">ordena y deduplica</text>
    <text x="478" y="450" class="m">$(words list)</text>
    <text x="478" y="468" font-size="13" fill="#8b949e">cuenta palabras</text>
    <text x="478" y="494" class="m">$(word n,list)</text>
    <text x="478" y="512" font-size="13" fill="#8b949e">palabra n, desde 1</text>
    <text x="478" y="538" class="m">$(strip text)</text>
    <text x="478" y="556" font-size="13" fill="#8b949e">quita espacios sobrantes</text>
  </g>
</svg>
