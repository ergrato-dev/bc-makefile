<svg viewBox="0 0 1000 460" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Árbol de decisión: Make si hay archivos que rehacer o tareas sobre bash; CMake, Bazel, Task o just según plataforma, escala y argumentos</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
  </defs>
  <rect width="1000" height="460" fill="#0d1117"/>

  <g font-family="Inter, system-ui, -apple-system, sans-serif" font-size="13" fill="#f0f6fc" text-anchor="middle">
    <!-- Preguntas -->
    <g fill="#161b22" stroke="#58a6ff" stroke-width="2">
      <rect x="350" y="30" width="300" height="60" rx="14"/>
      <rect x="40" y="150" width="280" height="60" rx="14"/>
      <rect x="680" y="150" width="280" height="60" rx="14"/>
      <rect x="220" y="260" width="240" height="60" rx="14"/>
      <rect x="540" y="260" width="240" height="60" rx="14"/>
    </g>
    <text x="500" y="55">¿Generas archivos a partir</text>
    <text x="500" y="74">de otros archivos?</text>
    <text x="180" y="175">¿C/C++ multiplataforma</text>
    <text x="180" y="194">o IDEs y MSVC?</text>
    <text x="820" y="175">¿Windows sin WSL</text>
    <text x="820" y="194">o sin bash?</text>
    <text x="340" y="285">¿Monorepo grande con</text>
    <text x="340" y="304">varios lenguajes y CI lento?</text>
    <text x="660" y="285">¿Recetas con argumentos</text>
    <text x="660" y="304">posicionales a diario?</text>

    <!-- Respuestas -->
    <g font-size="14" font-weight="bold">
      <rect x="20" y="265" width="160" height="50" rx="6" fill="#161b22" stroke="#d2a8ff" stroke-width="2"/>
      <text x="100" y="295">CMake + Ninja</text>
      <rect x="820" y="265" width="140" height="50" rx="6" fill="#161b22" stroke="#d2a8ff" stroke-width="2"/>
      <text x="890" y="295">Task</text>
      <rect x="220" y="380" width="110" height="50" rx="6" fill="#161b22" stroke="#d2a8ff" stroke-width="2"/>
      <text x="275" y="410">Bazel</text>
      <rect x="350" y="380" width="110" height="50" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2.5"/>
      <text x="405" y="410">Make</text>
      <rect x="520" y="380" width="120" height="50" rx="6" fill="#161b22" stroke="#d2a8ff" stroke-width="2"/>
      <text x="580" y="410">just</text>
      <rect x="660" y="380" width="160" height="50" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2.5"/>
      <text x="740" y="401">Make</text>
      <text x="740" y="420" font-size="12" font-weight="normal" fill="#8b949e">fachada de tareas</text>
    </g>

    <!-- Flechas -->
    <g fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)">
      <path d="M400,90 V120 H180 V150"/>
      <path d="M600,90 V120 H820 V150"/>
      <line x1="100" y1="210" x2="100" y2="265"/>
      <line x1="300" y1="210" x2="300" y2="260"/>
      <line x1="700" y1="210" x2="700" y2="260"/>
      <line x1="900" y1="210" x2="900" y2="265"/>
      <line x1="260" y1="320" x2="260" y2="380"/>
      <line x1="420" y1="320" x2="420" y2="380"/>
      <line x1="580" y1="320" x2="580" y2="380"/>
      <line x1="740" y1="320" x2="740" y2="380"/>
    </g>

    <!-- Etiquetas -->
    <g font-size="12" text-anchor="start">
      <text x="290" y="113" fill="#8b949e" text-anchor="middle">Sí</text>
      <text x="710" y="113" fill="#8b949e" text-anchor="middle">No: solo tareas</text>
      <text x="108" y="242" fill="#8b949e">Sí</text>
      <text x="308" y="240" fill="#8b949e">No</text>
      <text x="708" y="240" fill="#8b949e">No</text>
      <text x="908" y="242" fill="#8b949e">Sí</text>
      <text x="268" y="355" fill="#8b949e">Sí</text>
      <text x="428" y="355" fill="#8b949e">No</text>
      <text x="588" y="355" fill="#8b949e">Sí</text>
      <text x="748" y="355" fill="#8b949e">No</text>
    </g>
  </g>
</svg>
