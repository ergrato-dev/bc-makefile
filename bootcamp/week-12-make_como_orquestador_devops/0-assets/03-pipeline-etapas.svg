<svg viewBox="0 0 1000 750" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>make ci encadena lint, test, build y report; el primer código de salida distinto de cero aborta el pipeline</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
    <marker id="arrow-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f85149"/>
    </marker>
    <marker id="arrow-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/>
    </marker>
  </defs>
  <rect width="1000" height="750" fill="#0d1117"/>

  <g font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14" fill="#f0f6fc" text-anchor="middle">
    <!-- Líneas de vida -->
    <g stroke="#30363d" stroke-width="2" stroke-dasharray="4 4">
      <line x1="100" y1="60" x2="100" y2="730"/>
      <line x1="340" y1="60" x2="340" y2="730"/>
      <line x1="490" y1="60" x2="490" y2="730"/>
      <line x1="630" y1="60" x2="630" y2="730"/>
      <line x1="770" y1="60" x2="770" y2="730"/>
      <line x1="900" y1="60" x2="900" y2="730"/>
    </g>

    <!-- Participantes -->
    <rect x="30" y="20" width="140" height="40" rx="6" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
    <text x="100" y="45">Desarrollador</text>
    <rect x="280" y="20" width="120" height="40" rx="6" fill="#161b22" stroke="#f78166" stroke-width="2.5"/>
    <text x="340" y="45">Make</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      <rect x="430" y="20" width="120" height="40" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
      <text x="490" y="45">lint</text>
      <rect x="570" y="20" width="120" height="40" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
      <text x="630" y="45">test</text>
      <rect x="710" y="20" width="120" height="40" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
      <text x="770" y="45">build</text>
      <rect x="840" y="20" width="120" height="40" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
      <text x="900" y="45">report</text>
    </g>

    <!-- Bloques alt -->
    <g fill="none" stroke="#8b949e" stroke-width="1.5">
      <rect x="20" y="165" width="960" height="200" rx="4"/>
      <line x1="20" y1="265" x2="980" y2="265" stroke-dasharray="6 4"/>
      <rect x="20" y="390" width="960" height="320" rx="4"/>
      <line x1="20" y1="490" x2="980" y2="490" stroke-dasharray="6 4"/>
    </g>
    <g font-size="12" text-anchor="start">
      <rect x="20" y="165" width="150" height="22" fill="#161b22" stroke="#8b949e" stroke-width="1.5"/>
      <text x="30" y="181"><tspan font-weight="bold">alt</tspan> <tspan fill="#f85149">[lint falla]</tspan></text>
      <rect x="20" y="265" width="150" height="22" fill="#161b22" stroke="#8b949e" stroke-width="1.5"/>
      <text x="30" y="281"><tspan font-weight="bold">else</tspan> <tspan fill="#3fb950">[lint OK]</tspan></text>
      <rect x="20" y="390" width="150" height="22" fill="#161b22" stroke="#8b949e" stroke-width="1.5"/>
      <text x="30" y="406"><tspan font-weight="bold">alt</tspan> <tspan fill="#f85149">[tests fallan]</tspan></text>
      <rect x="20" y="490" width="150" height="22" fill="#161b22" stroke="#8b949e" stroke-width="1.5"/>
      <text x="30" y="506"><tspan font-weight="bold">else</tspan> <tspan fill="#3fb950">[tests OK]</tspan></text>
    </g>

    <!-- Mensajes -->
    <g fill="none" stroke-width="2">
      <line x1="100" y1="100" x2="340" y2="100" stroke="#8b949e" marker-end="url(#arrow)"/>
      <line x1="340" y1="140" x2="490" y2="140" stroke="#8b949e" marker-end="url(#arrow)"/>
      <line x1="490" y1="215" x2="340" y2="215" stroke="#f85149" stroke-dasharray="6 4" marker-end="url(#arrow-r)"/>
      <line x1="340" y1="245" x2="100" y2="245" stroke="#f85149" stroke-dasharray="6 4" marker-end="url(#arrow-r)"/>
      <line x1="490" y1="315" x2="340" y2="315" stroke="#3fb950" stroke-dasharray="6 4" marker-end="url(#arrow-g)"/>
      <line x1="340" y1="345" x2="630" y2="345" stroke="#8b949e" marker-end="url(#arrow)"/>
      <line x1="630" y1="440" x2="340" y2="440" stroke="#f85149" stroke-dasharray="6 4" marker-end="url(#arrow-r)"/>
      <line x1="340" y1="470" x2="100" y2="470" stroke="#f85149" stroke-dasharray="6 4" marker-end="url(#arrow-r)"/>
      <line x1="630" y1="540" x2="340" y2="540" stroke="#3fb950" stroke-dasharray="6 4" marker-end="url(#arrow-g)"/>
      <line x1="340" y1="575" x2="770" y2="575" stroke="#8b949e" marker-end="url(#arrow)"/>
      <line x1="770" y1="610" x2="340" y2="610" stroke="#8b949e" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
      <line x1="340" y1="645" x2="900" y2="645" stroke="#8b949e" marker-end="url(#arrow)"/>
      <line x1="900" y1="685" x2="100" y2="685" stroke="#3fb950" stroke-dasharray="6 4" marker-end="url(#arrow-g)"/>
    </g>

    <!-- Etiquetas de mensaje -->
    <g font-size="13" fill="#8b949e">
      <text x="220" y="92" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">make ci</text>
      <text x="415" y="132">ejecutar linters</text>
      <text x="415" y="207" fill="#f85149">exit ≠ 0</text>
      <text x="220" y="237" fill="#f85149">Pipeline abortado en lint</text>
      <text x="415" y="307" fill="#3fb950">exit 0</text>
      <text x="415" y="337">ejecutar tests</text>
      <text x="560" y="432" fill="#f85149">exit ≠ 0</text>
      <text x="220" y="462" fill="#f85149">Pipeline abortado en test</text>
      <text x="560" y="532" fill="#3fb950">exit 0</text>
      <text x="415" y="567">construir artefactos</text>
      <text x="560" y="602" font-size="12">artefactos generados</text>
      <text x="415" y="637">generar reporte</text>
      <text x="220" y="660" fill="#3fb950">Pipeline OK:</text>
      <text x="220" y="676" fill="#3fb950">resumen de resultados</text>
    </g>
  </g>
</svg>
