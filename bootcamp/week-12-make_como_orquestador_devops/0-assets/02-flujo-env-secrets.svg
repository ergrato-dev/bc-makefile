<svg viewBox="0 0 900 720" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Las variables llegan de .env en local o del runner en CI; guard-% las valida y solo las exportadas llegan a las recetas</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
    <marker id="arrow-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f85149"/>
    </marker>
    <marker id="arrow-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/>
    </marker>
  </defs>
  <rect width="900" height="720" fill="#0d1117"/>

  <g font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14" fill="#f0f6fc" text-anchor="middle">
    <!-- Encabezados de columna -->
    <text x="200" y="34" font-size="13" fill="#8b949e">En local</text>
    <text x="700" y="34" font-size="13" fill="#8b949e">En CI</text>

    <!-- Entradas -->
    <rect x="60" y="50" width="280" height="60" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="200" y="75" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">.env.example</text>
    <text x="200" y="96" font-size="13" fill="#8b949e">versionado, sin valores</text>

    <rect x="60" y="170" width="280" height="60" rx="6" fill="#161b22" stroke="#e3b341" stroke-width="2"/>
    <text x="200" y="195" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">.env</text>
    <text x="200" y="216" font-size="13" fill="#8b949e">ignorado por git</text>

    <rect x="560" y="170" width="280" height="60" rx="6" fill="#161b22" stroke="#79c0ff" stroke-width="2"/>
    <text x="700" y="195">GitHub Actions</text>
    <text x="700" y="216" font-size="13" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">env: + secrets</text>

    <!-- Make -->
    <rect x="320" y="310" width="260" height="60" rx="6" fill="#161b22" stroke="#f78166" stroke-width="2.5"/>
    <text x="450" y="345">Variables de Make</text>

    <polygon points="450,400 610,450 450,500 290,450" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="450" y="444" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">guard-%</text>
    <text x="450" y="465" font-size="13" fill="#8b949e">¿existe la variable?</text>

    <!-- Salidas -->
    <rect x="40" y="540" width="240" height="60" rx="6" fill="#161b22" stroke="#f85149" stroke-width="2"/>
    <text x="160" y="565" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">$(error)</text>
    <text x="160" y="586" font-size="13" fill="#8b949e">con el nombre de la variable</text>

    <rect x="600" y="540" width="270" height="60" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
    <text x="735" y="565" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">export DB_URL SECRET_KEY</text>
    <text x="735" y="586" font-size="13" fill="#8b949e">solo la lista, nunca a secas</text>

    <rect x="600" y="640" width="270" height="60" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
    <text x="735" y="665" font-size="13">Recetas leen <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">"$$SECRET_KEY"</tspan></text>
    <text x="735" y="686" font-size="13" fill="#8b949e">como variable de entorno</text>

    <!-- Flechas -->
    <g fill="none" stroke-width="2">
      <line x1="200" y1="110" x2="200" y2="170" stroke="#8b949e" marker-end="url(#arrow)"/>
      <path d="M200,230 V340 H320" stroke="#8b949e" marker-end="url(#arrow)"/>
      <path d="M700,230 V340 H580" stroke="#8b949e" marker-end="url(#arrow)"/>
      <line x1="450" y1="370" x2="450" y2="400" stroke="#8b949e" marker-end="url(#arrow)"/>
      <path d="M290,450 H160 V540" stroke="#f85149" marker-end="url(#arrow-r)"/>
      <path d="M610,450 H735 V540" stroke="#3fb950" marker-end="url(#arrow-g)"/>
      <line x1="735" y1="600" x2="735" y2="640" stroke="#3fb950" marker-end="url(#arrow-g)"/>
    </g>

    <!-- Etiquetas de flecha -->
    <g font-size="12" fill="#8b949e" text-anchor="start">
      <text x="210" y="145" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">cp</text>
      <text x="210" y="268" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">-include .env</text>
      <text x="210" y="286" fill="#e3b341">se parsea como Makefile</text>
      <text x="710" y="276">variables de entorno</text>
      <text x="230" y="442" fill="#f85149">No</text>
      <text x="650" y="442" fill="#3fb950">Sí</text>
    </g>
  </g>
</svg>
