<svg viewBox="0 0 960 560" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Los hooks frenan pronto pero se saltan con --no-verify; GitHub Actions y tu máquina ejecutan el mismo make ci</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
    <marker id="arrow-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f85149"/>
    </marker>
    <marker id="arrow-y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e3b341"/>
    </marker>
  </defs>
  <rect width="960" height="560" fill="#0d1117"/>

  <g font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14" fill="#f0f6fc" text-anchor="middle">
    <!-- Cajas -->
    <rect x="40" y="40" width="180" height="56" rx="6" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
    <text x="130" y="73">Desarrollador</text>

    <rect x="330" y="40" width="240" height="56" rx="6" fill="#161b22" stroke="#d2a8ff" stroke-width="2"/>
    <text x="450" y="63" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">pre-commit</text>
    <text x="450" y="84" font-size="13" fill="#8b949e">rechaza <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">.env*</tspan></text>

    <rect x="700" y="40" width="220" height="56" rx="6" fill="#161b22" stroke="#f85149" stroke-width="2"/>
    <text x="810" y="73">Commit bloqueado</text>

    <rect x="330" y="150" width="240" height="56" rx="6" fill="#161b22" stroke="#d2a8ff" stroke-width="2"/>
    <text x="450" y="173" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">pre-push</text>
    <text x="450" y="194" font-size="13" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">make lint</text>

    <rect x="700" y="150" width="220" height="56" rx="6" fill="#161b22" stroke="#f85149" stroke-width="2"/>
    <text x="810" y="183">Push bloqueado</text>

    <rect x="40" y="260" width="180" height="56" rx="6" fill="#161b22" stroke="#e3b341" stroke-width="2"/>
    <text x="130" y="293">Hooks saltados</text>

    <rect x="330" y="260" width="240" height="56" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="450" y="293" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">git push</text>

    <rect x="700" y="260" width="220" height="56" rx="6" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
    <text x="810" y="293">Tu máquina</text>

    <rect x="330" y="370" width="240" height="56" rx="6" fill="#161b22" stroke="#79c0ff" stroke-width="2"/>
    <text x="450" y="403">GitHub Actions</text>

    <rect x="700" y="370" width="220" height="56" rx="6" fill="#161b22" stroke="#f78166" stroke-width="2.5"/>
    <text x="810" y="403" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">make ci</text>

    <!-- Cadena de make ci -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      <rect x="40" y="490" width="128" height="48" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
      <text x="104" y="519">env-check</text>
      <rect x="228" y="490" width="128" height="48" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
      <text x="292" y="519">lint</text>
      <rect x="416" y="490" width="128" height="48" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
      <text x="480" y="519">test</text>
      <rect x="604" y="490" width="128" height="48" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
      <text x="668" y="519">build</text>
      <rect x="792" y="490" width="128" height="48" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
      <text x="856" y="519">report</text>
    </g>

    <!-- Flechas -->
    <g fill="none" stroke-width="2">
      <line x1="220" y1="68" x2="330" y2="68" stroke="#8b949e" marker-end="url(#arrow)"/>
      <line x1="570" y1="68" x2="700" y2="68" stroke="#f85149" marker-end="url(#arrow-r)"/>
      <line x1="450" y1="96" x2="450" y2="150" stroke="#8b949e" marker-end="url(#arrow)"/>
      <line x1="570" y1="178" x2="700" y2="178" stroke="#f85149" marker-end="url(#arrow-r)"/>
      <line x1="130" y1="96" x2="130" y2="260" stroke="#e3b341" stroke-dasharray="6 4" marker-end="url(#arrow-y)"/>
      <line x1="450" y1="206" x2="450" y2="260" stroke="#8b949e" marker-end="url(#arrow)"/>
      <line x1="220" y1="288" x2="330" y2="288" stroke="#e3b341" stroke-dasharray="6 4" marker-end="url(#arrow-y)"/>
      <line x1="810" y1="316" x2="810" y2="370" stroke="#8b949e" marker-end="url(#arrow)"/>
      <line x1="450" y1="316" x2="450" y2="370" stroke="#8b949e" marker-end="url(#arrow)"/>
      <line x1="570" y1="398" x2="700" y2="398" stroke="#8b949e" marker-end="url(#arrow)"/>
      <path d="M810,426 V458 H104 V490" stroke="#8b949e" marker-end="url(#arrow)"/>
      <line x1="168" y1="514" x2="228" y2="514" stroke="#8b949e" marker-end="url(#arrow)"/>
      <line x1="356" y1="514" x2="416" y2="514" stroke="#8b949e" marker-end="url(#arrow)"/>
      <line x1="544" y1="514" x2="604" y2="514" stroke="#8b949e" marker-end="url(#arrow)"/>
      <line x1="732" y1="514" x2="792" y2="514" stroke="#8b949e" marker-end="url(#arrow)"/>
    </g>

    <!-- Etiquetas de flecha -->
    <g font-size="12" fill="#8b949e">
      <text x="275" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">git commit</text>
      <text x="635" y="60" fill="#f85149" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">.env en staging</text>
      <text x="460" y="128" text-anchor="start" fill="#3fb950">OK</text>
      <text x="635" y="170" fill="#f85149">falla</text>
      <text x="140" y="182" text-anchor="start" fill="#e3b341" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">git commit --no-verify</text>
      <text x="460" y="238" text-anchor="start" fill="#3fb950">OK</text>
      <text x="820" y="348" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">make ci</text>
      <text x="635" y="390">único paso</text>
    </g>
  </g>
</svg>
