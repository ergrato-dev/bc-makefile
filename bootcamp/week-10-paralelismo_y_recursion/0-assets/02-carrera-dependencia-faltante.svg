<svg viewBox="0 0 800 364" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Una carrera es una dependencia que falta: en serie funciona por el orden, con -j2 falla, declarada funciona siempre</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
    <marker id="arrow-flow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/>
    </marker>
  </defs>
  <rect width="800" height="364" fill="#0d1117"/>

  <g font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14">
    <!-- paneles -->
    <g fill="none" stroke="#30363d" stroke-width="1.5">
      <rect x="15" y="20" width="250" height="324" rx="10"/>
      <rect x="275" y="20" width="250" height="324" rx="10"/>
      <rect x="535" y="20" width="250" height="324" rx="10"/>
    </g>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" text-anchor="middle">
      <text x="140" y="48" fill="#8b949e">make (en serie)</text>
      <text x="400" y="48" fill="#f85149">make -j2</text>
      <text x="660" y="48" fill="#3fb950">page.txt: config.txt</text>
    </g>

    <!-- serie -->
    <rect x="40" y="70" width="200" height="54" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="140" y="102" fill="#f0f6fc" text-anchor="middle"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace">config.txt</text>
    <line x1="140" y1="124" x2="140" y2="168" stroke="#8b949e" stroke-width="2"
          stroke-dasharray="5 4" marker-end="url(#arrow)"/>
    <text x="150" y="151" fill="#8b949e" font-size="12">orden de la lista</text>
    <rect x="40" y="170" width="200" height="54" rx="6" fill="#161b22" stroke="#f78166" stroke-width="2"/>
    <text x="140" y="193" fill="#f0f6fc" text-anchor="middle"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace">page.txt</text>
    <text x="140" y="213" fill="#8b949e" text-anchor="middle" font-size="12">lee config.txt</text>
    <line x1="140" y1="224" x2="140" y2="268" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="40" y="270" width="200" height="54" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
    <text x="140" y="293" fill="#3fb950" text-anchor="middle">funciona por el orden</text>
    <text x="140" y="313" fill="#3fb950" text-anchor="middle">de la lista</text>

    <!-- -j2 -->
    <rect x="285" y="70" width="110" height="54" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="340" y="93" fill="#f0f6fc" text-anchor="middle" font-size="13"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace">config.txt</text>
    <text x="340" y="113" fill="#8b949e" text-anchor="middle" font-size="12">tarda 1 s</text>
    <rect x="405" y="70" width="110" height="54" rx="6" fill="#161b22" stroke="#f78166" stroke-width="2"/>
    <text x="460" y="93" fill="#f0f6fc" text-anchor="middle" font-size="13"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace">page.txt</text>
    <text x="460" y="113" fill="#8b949e" text-anchor="middle" font-size="12">lee config.txt</text>
    <text x="340" y="190" fill="#e3b341" text-anchor="middle" font-size="12">arrancan a la vez:</text>
    <text x="340" y="208" fill="#e3b341" text-anchor="middle" font-size="12">config.txt aún</text>
    <text x="340" y="226" fill="#e3b341" text-anchor="middle" font-size="12">no existe</text>
    <line x1="460" y1="124" x2="460" y2="268" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="300" y="270" width="200" height="54" rx="6" fill="#161b22" stroke="#f85149" stroke-width="2"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#f85149" text-anchor="middle">
      <text x="400" y="293">No such file</text>
      <text x="400" y="313">or directory</text>
    </g>

    <!-- arreglo -->
    <rect x="560" y="70" width="200" height="54" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="660" y="102" fill="#f0f6fc" text-anchor="middle"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace">config.txt</text>
    <line x1="660" y1="124" x2="660" y2="168" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow-flow)"/>
    <text x="670" y="151" fill="#58a6ff" font-size="12">arista declarada</text>
    <rect x="560" y="170" width="200" height="54" rx="6" fill="#161b22" stroke="#f78166" stroke-width="2"/>
    <text x="660" y="193" fill="#f0f6fc" text-anchor="middle"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace">page.txt</text>
    <text x="660" y="213" fill="#8b949e" text-anchor="middle" font-size="12">lee config.txt</text>
    <line x1="660" y1="224" x2="660" y2="268" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="560" y="270" width="200" height="54" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
    <text x="660" y="293" fill="#3fb950" text-anchor="middle">correcto con</text>
    <text x="660" y="313" fill="#3fb950" text-anchor="middle">cualquier -j</text>
  </g>
</svg>
