<svg viewBox="0 0 800 440" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Anatomía de una regla: el target depende de sus dependencias y ejecuta una receta</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
    <style>.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}</style>
  </defs>
  <rect width="800" height="440" fill="#0d1117"/>

  <g font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14" text-anchor="middle">
    <text x="400" y="36" font-size="20" font-weight="bold" fill="#f0f6fc">Anatomía de una regla</text>

    <!-- target -->
    <rect x="280" y="64" width="240" height="64" rx="6" fill="#161b22" stroke="#f78166" stroke-width="2"/>
    <text x="400" y="92" class="m" font-size="16" font-weight="bold" fill="#f78166">target</text>
    <text x="400" y="114" font-size="13" fill="#8b949e">nombre del artefacto o acción</text>

    <!-- dependencias -->
    <rect x="60" y="200" width="260" height="64" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="190" y="228" class="m" font-size="16" font-weight="bold" fill="#58a6ff">dependencias</text>
    <text x="190" y="250" font-size="13" fill="#8b949e">qué debe existir antes</text>

    <!-- receta -->
    <rect x="480" y="200" width="260" height="80" rx="6" fill="#161b22" stroke="#d2a8ff" stroke-width="2"/>
    <text x="610" y="228" class="m" font-size="16" font-weight="bold" fill="#d2a8ff">receta</text>
    <text x="610" y="249" font-size="13" fill="#8b949e">comandos de shell</text>
    <text x="610" y="268" font-size="13" fill="#e3b341">indentada con TAB obligatorio</text>

    <!-- se construyen -->
    <rect x="20" y="350" width="280" height="64" rx="6" fill="#161b22" stroke="#e3b341" stroke-width="2"/>
    <text x="160" y="377" fill="#f0f6fc">Make los construye primero</text>
    <text x="160" y="399" font-size="13" fill="#8b949e">(busca reglas para ellos)</text>

    <!-- al día -->
    <rect x="340" y="350" width="300" height="64" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
    <text x="490" y="377" fill="#f0f6fc">Make omite la receta</text>
    <text x="490" y="399" font-size="13" fill="#8b949e">solo si el target es un archivo real</text>

    <!-- flechas -->
    <g stroke="#8b949e" stroke-width="2" fill="none" marker-end="url(#arrow)">
      <line x1="360" y1="128" x2="222" y2="198"/>
      <line x1="440" y1="128" x2="578" y2="198"/>
      <line x1="150" y1="264" x2="150" y2="348"/>
      <line x1="260" y1="264" x2="440" y2="348"/>
    </g>
    <g font-size="13" fill="#8b949e">
      <text x="282" y="158" text-anchor="end">depende de</text>
      <text x="518" y="158" text-anchor="start">ejecuta</text>
      <text x="140" y="312" text-anchor="end">si no existen</text>
      <text x="362" y="300" text-anchor="start">si ya existen y están al día</text>
    </g>
  </g>
</svg>
