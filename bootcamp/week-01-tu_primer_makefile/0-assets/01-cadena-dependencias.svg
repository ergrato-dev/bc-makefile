<svg viewBox="0 0 800 320" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Cadena de dependencias: run depende de link, compile y prepare, que se ejecutan en orden inverso</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/>
    </marker>
    <style>.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}</style>
  </defs>
  <rect width="800" height="320" fill="#0d1117"/>

  <g font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14" text-anchor="middle">
    <text x="400" y="36" font-size="20" font-weight="bold" fill="#f0f6fc">Cadena de dependencias</text>

    <text x="100" y="98" class="m" font-size="13" fill="#f78166">$ make run</text>

    <!-- cajas -->
    <g stroke-width="2" fill="#161b22">
      <rect x="40" y="110" width="120" height="56" rx="6" stroke="#f78166"/>
      <rect x="240" y="110" width="120" height="56" rx="6" stroke="#58a6ff"/>
      <rect x="440" y="110" width="120" height="56" rx="6" stroke="#58a6ff"/>
      <rect x="640" y="110" width="120" height="56" rx="6" stroke="#58a6ff"/>
    </g>
    <g class="m" font-size="16" fill="#f0f6fc">
      <text x="100" y="144">run</text>
      <text x="300" y="144">link</text>
      <text x="500" y="144">compile</text>
      <text x="700" y="144">prepare</text>
    </g>

    <!-- depende de -->
    <g stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)">
      <line x1="160" y1="138" x2="238" y2="138"/>
      <line x1="360" y1="138" x2="438" y2="138"/>
      <line x1="560" y1="138" x2="638" y2="138"/>
    </g>
    <g font-size="12" fill="#8b949e">
      <text x="200" y="128">depende de</text>
      <text x="400" y="128">depende de</text>
      <text x="600" y="128">depende de</text>
    </g>

    <!-- orden de ejecución -->
    <g font-size="15" font-weight="bold" fill="#3fb950">
      <text x="100" y="196">4º</text>
      <text x="300" y="196">3º</text>
      <text x="500" y="196">2º</text>
      <text x="700" y="196">1º</text>
    </g>
    <line x1="730" y1="222" x2="70" y2="222" stroke="#3fb950" stroke-width="2" marker-end="url(#arrow-green)"/>
    <text x="400" y="248" fill="#3fb950">orden de ejecución: de las hojas hacia la raíz</text>

    <text x="400" y="294" font-size="13" fill="#8b949e"><tspan class="m" fill="#f0f6fc">make compile</tspan> solo ejecuta <tspan class="m" fill="#f0f6fc">prepare</tspan> y <tspan class="m" fill="#f0f6fc">compile</tspan>: nada más de lo necesario</text>
  </g>
</svg>
