<svg viewBox="0 0 1000 840" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>El hook pre-commit ejecuta make check y se puede saltar; el runner de CI ejecuta make ci, el mismo comando que en local, y solo publica si todo pasa</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
    <marker id="arrow-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f85149"/>
    </marker>
    <marker id="arrow-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/>
    </marker>
  </defs>
  <rect width="1000" height="840" fill="#0d1117"/>

  <g font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14" fill="#f0f6fc" text-anchor="middle">
    <!-- Líneas de vida -->
    <g stroke="#30363d" stroke-width="2" stroke-dasharray="4 4">
      <line x1="90" y1="60" x2="90" y2="820"/>
      <line x1="290" y1="60" x2="290" y2="820"/>
      <line x1="510" y1="60" x2="510" y2="820"/>
      <line x1="720" y1="60" x2="720" y2="820"/>
      <line x1="910" y1="60" x2="910" y2="820"/>
    </g>

    <!-- Participantes -->
    <rect x="20" y="20" width="140" height="40" rx="6" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
    <text x="90" y="45">Desarrollador</text>
    <rect x="215" y="20" width="150" height="40" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="290" y="45" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">git commit</text>
    <rect x="430" y="20" width="160" height="40" rx="6" fill="#161b22" stroke="#d2a8ff" stroke-width="2"/>
    <text x="510" y="45" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">hooks/pre-commit</text>
    <rect x="645" y="20" width="150" height="40" rx="6" fill="#161b22" stroke="#f78166" stroke-width="2.5"/>
    <text x="720" y="45">Makefile raíz</text>
    <rect x="840" y="20" width="140" height="40" rx="6" fill="#161b22" stroke="#79c0ff" stroke-width="2"/>
    <text x="910" y="45">Runner de CI</text>

    <!-- Bloques alt -->
    <g fill="none" stroke="#8b949e" stroke-width="1.5">
      <rect x="20" y="295" width="960" height="130" rx="4"/>
      <line x1="20" y1="370" x2="980" y2="370" stroke-dasharray="6 4"/>
      <rect x="20" y="670" width="960" height="130" rx="4"/>
      <line x1="20" y1="745" x2="980" y2="745" stroke-dasharray="6 4"/>
    </g>
    <g font-size="12" text-anchor="start">
      <rect x="20" y="295" width="180" height="22" fill="#161b22" stroke="#8b949e" stroke-width="1.5"/>
      <text x="30" y="311"><tspan font-weight="bold">alt</tspan> <tspan fill="#f85149">[algún lint falla]</tspan></text>
      <rect x="20" y="370" width="180" height="22" fill="#161b22" stroke="#8b949e" stroke-width="1.5"/>
      <text x="30" y="386"><tspan font-weight="bold">else</tspan> <tspan fill="#3fb950">[todo OK]</tspan></text>
      <rect x="20" y="670" width="180" height="22" fill="#161b22" stroke="#8b949e" stroke-width="1.5"/>
      <text x="30" y="686"><tspan font-weight="bold">alt</tspan> <tspan fill="#f85149">[un servicio falla]</tspan></text>
      <rect x="20" y="745" width="180" height="22" fill="#161b22" stroke="#8b949e" stroke-width="1.5"/>
      <text x="30" y="761"><tspan font-weight="bold">else</tspan> <tspan fill="#3fb950">[todo OK]</tspan></text>
    </g>

    <!-- Nota -->
    <rect x="30" y="445" width="340" height="32" rx="4" fill="#161b22" stroke="#e3b341" stroke-width="1.5"/>
    <text x="200" y="466" font-size="12" fill="#e3b341"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">git commit --no-verify</tspan> salta el hook</text>

    <!-- Mensajes -->
    <g fill="none" stroke-width="2">
      <line x1="90" y1="100" x2="290" y2="100" stroke="#8b949e" marker-end="url(#arrow)"/>
      <line x1="290" y1="145" x2="510" y2="145" stroke="#8b949e" marker-end="url(#arrow)"/>
      <line x1="510" y1="190" x2="720" y2="190" stroke="#8b949e" marker-end="url(#arrow)"/>
      <path d="M720,225 H765 V275 H722" stroke="#8b949e" marker-end="url(#arrow)"/>
      <line x1="720" y1="350" x2="90" y2="350" stroke="#f85149" stroke-dasharray="6 4" marker-end="url(#arrow-r)"/>
      <line x1="720" y1="410" x2="290" y2="410" stroke="#3fb950" stroke-dasharray="6 4" marker-end="url(#arrow-g)"/>
      <line x1="290" y1="515" x2="910" y2="515" stroke="#8b949e" marker-end="url(#arrow)"/>
      <line x1="910" y1="565" x2="720" y2="565" stroke="#8b949e" marker-end="url(#arrow)"/>
      <path d="M720,600 H765 V650 H722" stroke="#8b949e" marker-end="url(#arrow)"/>
      <line x1="720" y1="725" x2="910" y2="725" stroke="#f85149" stroke-dasharray="6 4" marker-end="url(#arrow-r)"/>
      <line x1="910" y1="785" x2="720" y2="785" stroke="#3fb950" marker-end="url(#arrow-g)"/>
    </g>

    <!-- Etiquetas -->
    <g font-size="12" fill="#8b949e">
      <text x="190" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">git commit</text>
      <text x="395" y="137"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">core.hooksPath</tspan> apunta a <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">hooks/</tspan></text>
      <text x="615" y="182" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">exec make check</text>
      <g text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
        <text x="775" y="240">backend/lint</text>
        <text x="775" y="256">frontend/lint</text>
        <text x="775" y="272">infra/lint</text>
      </g>
      <text x="190" y="342" fill="#f85149">commit abortado</text>
      <text x="400" y="402" fill="#3fb950">commit creado</text>
      <text x="400" y="507">push</text>
      <text x="815" y="557" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">make ci</text>
      <text x="815" y="583">el mismo comando</text>
      <g text-anchor="start">
        <text x="775" y="615">por servicio:</text>
        <text x="775" y="631" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">deps · lint ·</text>
        <text x="775" y="647" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">test · build</text>
      </g>
      <text x="815" y="717" fill="#f85149">exit ≠ 0, pipeline en rojo</text>
      <text x="815" y="777" fill="#3fb950" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">make push CI=true</text>
    </g>
  </g>
</svg>
