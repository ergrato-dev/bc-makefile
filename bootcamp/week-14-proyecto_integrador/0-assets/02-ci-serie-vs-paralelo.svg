<svg viewBox="0 0 800 420" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>ci en serie, con -j sin dependencia y con build: test: build solo espera a test si la dependencia está declarada</title>
  <defs>
    <style>.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}</style>
    <marker id="arrow-ok" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/>
    </marker>
  </defs>
  <rect width="800" height="420" fill="#0d1117"/>

  <!-- eje: t=0 en x=200, 1 unidad = 55 px -->
  <g font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14">
    <!-- rejilla -->
    <g stroke="#30363d" stroke-width="1" stroke-dasharray="3 5">
      <line x1="200" y1="24" x2="200" y2="356"/>
      <line x1="310" y1="24" x2="310" y2="356"/>
      <line x1="365" y1="24" x2="365" y2="356"/>
      <line x1="475" y1="24" x2="475" y2="356"/>
      <line x1="585" y1="24" x2="585" y2="356"/>
    </g>

    <!-- carril 1: serie -->
    <text x="20" y="52" class="m" fill="#f78166">make ci</text>
    <text x="20" y="72" font-size="12" fill="#8b949e">en serie</text>
    <g class="m" font-size="13" text-anchor="middle" fill="#f0f6fc">
      <rect x="200" y="40" width="110" height="30" rx="5" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
      <text x="255" y="60">lint</text>
      <rect x="310" y="40" width="165" height="30" rx="5" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
      <text x="392" y="60">test</text>
      <rect x="475" y="40" width="110" height="30" rx="5" fill="#161b22" stroke="#f78166" stroke-width="2"/>
      <text x="530" y="60">build</text>
    </g>
    <text x="610" y="52" font-size="13" fill="#8b949e">orden de la lista:</text>
    <text x="610" y="70" font-size="13" fill="#8b949e">solo vale en serie</text>

    <line x1="20" y1="94" x2="780" y2="94" stroke="#30363d" stroke-width="1.5"/>

    <!-- carril 2: -j sin dependencia -->
    <text x="20" y="130" class="m" fill="#f78166">make -j ci</text>
    <text x="20" y="152" class="m" font-size="12" fill="#8b949e">ci: lint test build</text>
    <text x="20" y="172" font-size="12" fill="#8b949e">sin más aristas</text>
    <g class="m" font-size="13" text-anchor="middle" fill="#f0f6fc">
      <rect x="200" y="106" width="110" height="28" rx="5" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
      <text x="255" y="125">lint</text>
      <rect x="200" y="140" width="165" height="28" rx="5" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
      <text x="282" y="159">test</text>
      <rect x="200" y="174" width="110" height="28" rx="5" fill="#161b22" stroke="#f85149" stroke-width="2"/>
      <text x="255" y="193" fill="#f85149">build</text>
    </g>
    <text x="320" y="193" font-size="12" fill="#e3b341">acaba con test a medias</text>
    <text x="610" y="140" font-size="13" fill="#f85149">build no espera</text>
    <text x="610" y="158" font-size="13" fill="#f85149">a test</text>
    <text x="610" y="182" font-size="12" fill="#e3b341">seguro solo si ninguno</text>
    <text x="610" y="198" font-size="12" fill="#e3b341">lee lo que otro escribe</text>

    <line x1="20" y1="220" x2="780" y2="220" stroke="#30363d" stroke-width="1.5"/>

    <!-- carril 3: -j con build: test -->
    <text x="20" y="256" class="m" fill="#f78166">make -j ci</text>
    <text x="20" y="278" class="m" font-size="12" fill="#3fb950">build: test</text>
    <text x="20" y="298" font-size="12" fill="#8b949e">dependencia declarada</text>
    <g class="m" font-size="13" text-anchor="middle" fill="#f0f6fc">
      <rect x="200" y="232" width="110" height="28" rx="5" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
      <text x="255" y="251">lint</text>
      <rect x="200" y="266" width="165" height="28" rx="5" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
      <text x="282" y="285">test</text>
      <rect x="365" y="314" width="110" height="28" rx="5" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
      <text x="420" y="333" fill="#3fb950">build</text>
    </g>
    <path d="M365,280 Q385,280 385,312" fill="none" stroke="#3fb950" stroke-width="2" marker-end="url(#arrow-ok)"/>
    <text x="610" y="266" font-size="13" fill="#3fb950">build arranca cuando</text>
    <text x="610" y="284" font-size="13" fill="#3fb950">test termina</text>
    <text x="610" y="308" font-size="12" fill="#8b949e">lint sigue en paralelo;</text>
    <text x="610" y="324" font-size="12" fill="#8b949e">correcto con cualquier -j</text>

    <!-- eje de tiempo -->
    <line x1="200" y1="362" x2="585" y2="362" stroke="#8b949e" stroke-width="1.5"/>
    <g font-size="12" fill="#8b949e" text-anchor="middle">
      <text x="200" y="380">0</text>
      <text x="310" y="380">2</text>
      <text x="365" y="380">3</text>
      <text x="475" y="380">5</text>
      <text x="585" y="380">7</text>
    </g>
    <text x="20" y="380" font-size="12" fill="#8b949e">tiempo (misma escala)</text>

    <text x="400" y="408" font-size="13" fill="#d2a8ff" text-anchor="middle">Make 4.4+: <tspan class="m">ci: lint .WAIT test .WAIT build</tspan> fuerza el orden también con -j</text>
  </g>
</svg>
