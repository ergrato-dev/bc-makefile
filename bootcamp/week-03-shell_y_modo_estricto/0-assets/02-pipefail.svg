<svg viewBox="0 0 800 380" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Código de salida de una tubería con un awk que falla: sin pipefail Make da éxito, con pipefail da error</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
    <style>.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}</style>
  </defs>
  <rect width="800" height="380" fill="#0d1117"/>

  <g font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14" text-anchor="middle">
    <text x="400" y="36" font-size="20" font-weight="bold" fill="#f0f6fc">Código de salida de una tubería, con y sin pipefail</text>

    <!-- tubería -->
    <rect x="30" y="76" width="190" height="64" rx="6" fill="#161b22" stroke="#f85149" stroke-width="2"/>
    <text x="125" y="102" fill="#f0f6fc"><tspan class="m">awk</tspan> (valida)</text>
    <text x="125" y="124" font-size="13" fill="#f85149">exit 1: línea corrupta</text>

    <rect x="260" y="76" width="110" height="64" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="315" y="102" class="m" fill="#f0f6fc">sort</text>
    <text x="315" y="124" font-size="13" fill="#3fb950">exit 0</text>

    <rect x="410" y="76" width="120" height="64" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="470" y="102" class="m" fill="#f0f6fc">uniq -c</text>
    <text x="470" y="124" font-size="13" fill="#3fb950">exit 0</text>

    <rect x="570" y="76" width="200" height="64" rx="6" fill="#161b22" stroke="#e3b341" stroke-width="2"/>
    <text x="670" y="102" class="m" fill="#f0f6fc">&gt; build/status.txt</text>
    <text x="670" y="124" font-size="13" fill="#e3b341">archivo a medias</text>

    <g stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)">
      <line x1="220" y1="108" x2="258" y2="108"/>
      <line x1="370" y1="108" x2="408" y2="108"/>
      <line x1="530" y1="108" x2="568" y2="108"/>
    </g>

    <!-- resultados -->
    <g stroke="#8b949e" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#arrow)">
      <line x1="450" y1="140" x2="230" y2="256"/>
      <line x1="490" y1="140" x2="590" y2="256"/>
    </g>
    <g font-size="13" fill="#8b949e">
      <text x="300" y="178" text-anchor="end">sin pipefail: exit 0</text>
      <text x="300" y="196" text-anchor="end">(el de la última etapa)</text>
      <text x="556" y="178" text-anchor="start">con -o pipefail: exit 1</text>
      <text x="556" y="196" text-anchor="start">(la última etapa que falló)</text>
    </g>

    <rect x="60" y="258" width="320" height="80" rx="6" fill="#161b22" stroke="#e3b341" stroke-width="2"/>
    <text x="220" y="290" font-size="15" font-weight="bold" fill="#e3b341">Make: OK</text>
    <text x="220" y="314" font-size="13" fill="#8b949e">el reporte incompleto pasa por bueno</text>

    <rect x="420" y="258" width="340" height="80" rx="6" fill="#161b22" stroke="#f85149" stroke-width="2"/>
    <text x="590" y="290" font-size="15" font-weight="bold" fill="#f85149">Make: Error 1</text>
    <text x="590" y="314" font-size="13" fill="#8b949e"><tspan class="m">.DELETE_ON_ERROR</tspan> borra el archivo</text>
  </g>
</svg>
