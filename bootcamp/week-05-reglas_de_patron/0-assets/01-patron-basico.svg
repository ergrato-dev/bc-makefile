<svg viewBox="0 0 800 400" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Una regla de patrón %.o: %.c se instancia una vez por cada target pedido</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
    <style>.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}</style>
  </defs>
  <rect width="800" height="400" fill="#0d1117"/>

  <g font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14" text-anchor="middle">
    <!-- Regla de patrón -->
    <rect x="250" y="20" width="300" height="100" rx="6" fill="#161b22" stroke="#f78166" stroke-width="2"/>
    <text x="400" y="46" fill="#8b949e" font-size="13">Regla de patrón (plantilla)</text>
    <text x="400" y="74" fill="#f0f6fc" class="m">%.o: %.c</text>
    <text x="400" y="100" fill="#f0f6fc" class="m">$(CC) -c $&lt; -o $@</text>

    <line x1="330" y1="120" x2="152" y2="186" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="400" y1="120" x2="400" y2="186" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="470" y1="120" x2="648" y2="186" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Targets pedidos -->
    <rect x="50" y="190" width="200" height="60" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="150" y="213" fill="#8b949e" font-size="13">target pedido</text>
    <text x="150" y="237" fill="#f0f6fc" class="m">main.o</text>
    <rect x="300" y="190" width="200" height="60" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="400" y="213" fill="#8b949e" font-size="13">target pedido</text>
    <text x="400" y="237" fill="#f0f6fc" class="m">calc.o</text>
    <rect x="550" y="190" width="200" height="60" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="650" y="213" fill="#8b949e" font-size="13">target pedido</text>
    <text x="650" y="237" fill="#f0f6fc" class="m">greet.o</text>

    <line x1="150" y1="250" x2="150" y2="286" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="400" y1="250" x2="400" y2="286" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="650" y1="250" x2="650" y2="286" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Instancias -->
    <g class="m" fill="#f0f6fc">
      <rect x="50" y="290" width="200" height="90" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
      <text x="150" y="317">stem = main</text>
      <text x="150" y="341">$&lt; = main.c</text>
      <text x="150" y="365">$@ = main.o</text>
      <rect x="300" y="290" width="200" height="90" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
      <text x="400" y="317">stem = calc</text>
      <text x="400" y="341">$&lt; = calc.c</text>
      <text x="400" y="365">$@ = calc.o</text>
      <rect x="550" y="290" width="200" height="90" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
      <text x="650" y="317">stem = greet</text>
      <text x="650" y="341">$&lt; = greet.c</text>
      <text x="650" y="365">$@ = greet.o</text>
    </g>
  </g>
</svg>
