<svg viewBox="0 0 900 330" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>make hola sin -r usa una regla de serie; con -r falla donde está el bug</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
    <style>.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}</style>
  </defs>
  <rect width="900" height="330" fill="#0d1117"/>

  <g font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14" fill="#f0f6fc" text-anchor="middle">
    <!-- Petición -->
    <rect x="20" y="135" width="240" height="70" rx="6" fill="#161b22" stroke="#f78166" stroke-width="2"/>
    <text x="140" y="164" class="m">make hola</text>
    <text x="140" y="188" fill="#8b949e" font-size="13">el Makefile no menciona hola</text>
    <line x1="260" y1="170" x2="298" y2="170" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Decisión -->
    <rect x="300" y="140" width="180" height="60" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="390" y="175" class="m">¿MAKEFLAGS += -r?</text>

    <path d="M480,158 C505,158 505,55 528,55" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="496" y="104" fill="#8b949e" font-size="13" text-anchor="end">No</text>
    <path d="M480,182 C505,182 505,216 528,216" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="496" y="212" fill="#8b949e" font-size="13" text-anchor="end">Sí</text>

    <!-- Rama sin -r -->
    <rect x="530" y="20" width="350" height="70" rx="6" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="705" y="47">Regla de serie <tspan class="m">%: %.c</tspan></text>
    <text x="705" y="72" class="m">cc hola.c -o hola</text>
    <line x1="705" y1="90" x2="705" y2="110" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="530" y="112" width="350" height="56" rx="6" fill="#161b22" stroke="#e3b341" stroke-width="2"/>
    <text x="705" y="136">Construye algo que nadie pidió,</text>
    <text x="705" y="157">con flags que no elegiste</text>

    <!-- Rama con -r -->
    <rect x="530" y="192" width="350" height="48" rx="6" fill="#161b22" stroke="#f85149" stroke-width="2"/>
    <text x="705" y="221" class="m">No rule to make target 'hola'</text>
    <line x1="705" y1="240" x2="705" y2="260" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="530" y="262" width="350" height="48" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
    <text x="705" y="291">El error aparece donde está el bug</text>
  </g>
</svg>
