<svg viewBox="0 0 820 320" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Regla de patrón genérica frente a static pattern rule: quién decide qué targets aplican</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
    <style>.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}</style>
  </defs>
  <rect width="820" height="320" fill="#0d1117"/>

  <g font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14" fill="#f0f6fc" text-anchor="middle">
    <!-- Panel izquierdo: patrón genérico -->
    <rect x="20" y="20" width="380" height="280" rx="8" fill="none" stroke="#30363d" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="210" y="48" font-size="15" font-weight="600">Regla de patrón genérica</text>
    <rect x="40" y="66" width="340" height="66" rx="6" fill="#161b22" stroke="#f78166" stroke-width="2"/>
    <text x="210" y="93" class="m">%.o: %.c</text>
    <text x="210" y="118" class="m">$(CC) -c $&lt; -o $@</text>
    <line x1="210" y1="132" x2="210" y2="168" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="40" y="170" width="340" height="62" rx="6" fill="#161b22" stroke="#e3b341" stroke-width="2"/>
    <text x="210" y="196">Aplica a CUALQUIER <tspan class="m">.o</tspan></text>
    <text x="210" y="218">que tenga <tspan class="m">.c</tspan> correspondiente</text>
    <text x="210" y="266" fill="#8b949e">Make decide qué targets califican</text>

    <!-- Panel derecho: static pattern rule -->
    <rect x="420" y="20" width="380" height="280" rx="8" fill="none" stroke="#30363d" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="610" y="48" font-size="15" font-weight="600">Static pattern rule</text>
    <rect x="440" y="66" width="340" height="66" rx="6" fill="#161b22" stroke="#f78166" stroke-width="2"/>
    <text x="610" y="93" class="m">$(LIB_OBJS): build/%.o: src/%.c</text>
    <text x="610" y="118" class="m">$(CC) -c $&lt; -o $@</text>
    <line x1="610" y1="132" x2="610" y2="168" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="440" y="170" width="340" height="62" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
    <text x="610" y="196">Solo aplica a los targets</text>
    <text x="610" y="218">listados en <tspan class="m">$(LIB_OBJS)</tspan></text>
    <text x="610" y="266" fill="#8b949e">Tú decides exactamente qué targets</text>
  </g>
</svg>
