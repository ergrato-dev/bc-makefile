<svg viewBox="0 0 820 510" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Cómo elige Make la regla de un target: explícita primero, luego patrón de stem más corto</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
    <style>.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}</style>
  </defs>
  <rect width="820" height="510" fill="#0d1117"/>

  <g font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14" fill="#f0f6fc" text-anchor="middle">
    <!-- Inicio -->
    <rect x="100" y="20" width="360" height="44" rx="6" fill="#161b22" stroke="#f78166" stroke-width="2"/>
    <text x="280" y="47">Make necesita construir: <tspan class="m">build/calc.o</tspan></text>
    <line x1="280" y1="64" x2="280" y2="98" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- ¿Receta explícita? -->
    <rect x="100" y="100" width="360" height="76" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="280" y="128">¿Alguna regla explícita (o static</text>
    <text x="280" y="150">pattern rule) le da receta?</text>

    <line x1="460" y1="138" x2="528" y2="138" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="494" y="130" fill="#8b949e" font-size="13">Sí</text>
    <rect x="530" y="104" width="270" height="68" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
    <text x="665" y="132">Usa esa receta</text>
    <text x="665" y="154" fill="#8b949e" font-size="13">si hay dos: la última, con aviso</text>

    <line x1="280" y1="176" x2="280" y2="220" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="292" y="203" fill="#8b949e" font-size="13" text-anchor="start">No (o solo prerrequisitos)</text>

    <!-- Candidatas -->
    <rect x="100" y="222" width="360" height="84" rx="6" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="280" y="248">Reúne reglas de patrón que casan</text>
    <text x="280" y="270">con el nombre: primero las tuyas,</text>
    <text x="280" y="292">luego las de serie</text>
    <line x1="280" y1="306" x2="280" y2="340" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- ¿Prerrequisitos? -->
    <rect x="100" y="342" width="360" height="64" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="280" y="368">¿Alguna tiene sus prerrequisitos</text>
    <text x="280" y="390">existentes o construibles?</text>

    <line x1="460" y1="374" x2="528" y2="374" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="494" y="366" fill="#8b949e" font-size="13">Sí</text>
    <rect x="530" y="342" width="270" height="64" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
    <text x="665" y="368">Elige la de stem más corto</text>
    <text x="665" y="390" fill="#8b949e" font-size="13">empate: la primera del Makefile</text>

    <line x1="280" y1="406" x2="280" y2="444" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="292" y="430" fill="#8b949e" font-size="13" text-anchor="start">No</text>

    <!-- Error -->
    <rect x="100" y="446" width="360" height="44" rx="6" fill="#161b22" stroke="#f85149" stroke-width="2"/>
    <text x="280" y="473">Error: <tspan class="m">No rule to make target</tspan></text>
  </g>
</svg>
