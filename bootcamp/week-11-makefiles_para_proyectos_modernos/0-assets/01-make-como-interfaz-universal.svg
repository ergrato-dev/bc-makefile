<svg viewBox="0 0 800 400" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Make como interfaz única delante de uv, Docker, pnpm y docker compose</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
  </defs>
  <rect width="800" height="400" fill="#0d1117"/>

  <g font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14">
    <rect x="310" y="20" width="180" height="40" rx="6" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="400" y="45" fill="#f0f6fc" text-anchor="middle">Desarrollador</text>
    <line x1="400" y1="60" x2="400" y2="108" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="410" y="89" fill="#79c0ff" font-size="13"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace">make &lt;target&gt;</text>

    <rect x="300" y="110" width="200" height="46" rx="6" fill="#161b22" stroke="#f78166" stroke-width="2"/>
    <text x="400" y="138" fill="#f0f6fc" text-anchor="middle" font-weight="600">GNU Make</text>

    <path d="M400,156 V180 H104 V208 M400,180 H695 V208 M301,180 V208 M498,180 V208" fill="none" stroke="#8b949e" stroke-width="2"/>
    <g stroke="#8b949e" stroke-width="2">
      <line x1="104" y1="200" x2="104" y2="208" marker-end="url(#arrow)"/>
      <line x1="301" y1="200" x2="301" y2="208" marker-end="url(#arrow)"/>
      <line x1="498" y1="200" x2="498" y2="208" marker-end="url(#arrow)"/>
      <line x1="695" y1="200" x2="695" y2="208" marker-end="url(#arrow)"/>
    </g>

    <!-- herramientas -->
    <g fill="#161b22" stroke="#58a6ff" stroke-width="2">
      <rect x="16" y="210" width="176" height="54" rx="6"/>
      <rect x="213" y="210" width="176" height="54" rx="6"/>
      <rect x="410" y="210" width="176" height="54" rx="6"/>
      <rect x="607" y="210" width="176" height="54" rx="6"/>
    </g>
    <g fill="#f0f6fc" text-anchor="middle">
      <text x="104" y="233">Python</text>
      <text x="301" y="233">Docker</text>
      <text x="498" y="233">Node.js</text>
      <text x="695" y="233">Compose</text>
    </g>
    <g fill="#8b949e" text-anchor="middle" font-size="12"
       font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      <text x="104" y="253">uv, pytest</text>
      <text x="301" y="253">docker build</text>
      <text x="498" y="253">pnpm</text>
      <text x="695" y="253">docker compose</text>
    </g>

    <g stroke="#8b949e" stroke-width="2">
      <line x1="104" y1="264" x2="104" y2="290" marker-end="url(#arrow)"/>
      <line x1="301" y1="264" x2="301" y2="290" marker-end="url(#arrow)"/>
      <line x1="498" y1="264" x2="498" y2="290" marker-end="url(#arrow)"/>
      <line x1="695" y1="264" x2="695" y2="290" marker-end="url(#arrow)"/>
    </g>

    <!-- resultados -->
    <g fill="#161b22" stroke="#3fb950" stroke-width="1.5">
      <rect x="16" y="292" width="176" height="86" rx="6"/>
      <rect x="213" y="292" width="176" height="86" rx="6"/>
      <rect x="410" y="292" width="176" height="86" rx="6"/>
      <rect x="607" y="292" width="176" height="86" rx="6"/>
    </g>
    <g fill="#f0f6fc" text-anchor="middle" font-size="13">
      <text x="104" y="317">.venv/ creado</text>
      <text x="104" y="339">tests con pytest</text>
      <text x="104" y="361">lint con ruff</text>
      <text x="301" y="317">Imagen construida</text>
      <text x="301" y="339">Contenedor corriendo</text>
      <text x="301" y="361">Push al registry</text>
      <text x="498" y="317">node_modules/</text>
      <text x="498" y="339">Bundle generado</text>
      <text x="498" y="361">Tests pasados</text>
      <text x="695" y="317">Stack local</text>
      <text x="695" y="339">Servicios orquestados</text>
      <text x="695" y="361">Logs centralizados</text>
    </g>
  </g>
</svg>
