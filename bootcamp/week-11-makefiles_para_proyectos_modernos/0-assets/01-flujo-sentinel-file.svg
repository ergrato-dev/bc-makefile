<svg viewBox="0 0 800 620" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>El sentinel .venv/.installed decide si make install vuelve a ejecutar uv sync</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
    <marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e3b341"/>
    </marker>
    <marker id="arrow-ok" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/>
    </marker>
  </defs>
  <rect width="800" height="620" fill="#0d1117"/>

  <g font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14">
    <rect x="310" y="20" width="180" height="44" rx="6" fill="#161b22" stroke="#f78166" stroke-width="2"/>
    <text x="400" y="47" fill="#f0f6fc" text-anchor="middle"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace">make install</text>
    <line x1="400" y1="64" x2="400" y2="98" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="250" y="100" width="300" height="50" rx="25" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
    <text x="400" y="130" fill="#f0f6fc" text-anchor="middle">¿Existe
      <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">.venv/.installed</tspan>?</text>

    <!-- no existe -->
    <path d="M250,125 H210 V288" fill="none" stroke="#e3b341" stroke-width="2" marker-end="url(#arrow-warn)"/>
    <text x="218" y="200" fill="#e3b341" font-size="12">no</text>

    <!-- existe -->
    <path d="M550,125 H590 V188" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="598" y="160" fill="#8b949e" font-size="12">sí</text>

    <rect x="425" y="190" width="330" height="60" rx="30" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
    <text x="590" y="215" fill="#f0f6fc" text-anchor="middle">¿<tspan
      font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">pyproject.toml</tspan> o <tspan
      font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">uv.lock</tspan></text>
    <text x="590" y="236" fill="#f0f6fc" text-anchor="middle">más nuevo que <tspan
      font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">.venv/.installed</tspan>?</text>

    <!-- dependencias cambiaron -->
    <path d="M500,250 V312 H322" fill="none" stroke="#e3b341" stroke-width="2" marker-end="url(#arrow-warn)"/>
    <text x="410" y="304" fill="#e3b341" font-size="12" text-anchor="middle">sí: cambiaron</text>

    <!-- al día -->
    <path d="M640,250 V378" fill="none" stroke="#3fb950" stroke-width="2" marker-end="url(#arrow-ok)"/>
    <text x="648" y="320" fill="#3fb950" font-size="12">no: ya está al día</text>

    <!-- instalación -->
    <rect x="100" y="290" width="220" height="44" rx="6" fill="#161b22" stroke="#e3b341" stroke-width="2"/>
    <text x="210" y="317" fill="#f0f6fc" text-anchor="middle"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace">uv sync --locked</text>
    <line x1="210" y1="334" x2="210" y2="368" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="80" y="370" width="260" height="44" rx="6" fill="#161b22" stroke="#e3b341" stroke-width="2"/>
    <text x="210" y="397" fill="#f0f6fc" text-anchor="middle"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace">touch .venv/.installed</text>
    <line x1="210" y1="414" x2="210" y2="448" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="90" y="450" width="240" height="44" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
    <text x="210" y="477" fill="#f0f6fc" text-anchor="middle">Instalación completa</text>

    <rect x="510" y="380" width="260" height="56" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#f0f6fc" text-anchor="middle">
      <text x="640" y="403">Nothing to be done</text>
      <text x="640" y="423">for 'install'.</text>
    </g>

    <!-- confluencia -->
    <path d="M210,494 V530 H640 V436" fill="none" stroke="#8b949e" stroke-width="2"/>
    <line x1="400" y1="530" x2="400" y2="548" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="250" y="550" width="300" height="44" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="400" y="577" fill="#f0f6fc" text-anchor="middle"><tspan
      font-family="ui-monospace, SFMono-Regular, Menlo, monospace">make test</tspan> puede ejecutarse</text>
  </g>
</svg>
