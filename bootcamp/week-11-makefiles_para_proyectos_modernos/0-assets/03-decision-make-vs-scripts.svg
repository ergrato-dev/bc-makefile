<svg viewBox="0 0 800 540" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Cuándo usar Make, la herramienta nativa del stack o un script llamado desde Make</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
  </defs>
  <rect width="800" height="540" fill="#0d1117"/>

  <g font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14">
    <!-- preguntas -->
    <g fill="#161b22" stroke="#8b949e" stroke-width="2">
      <rect x="290" y="20" width="260" height="56" rx="28"/>
      <rect x="290" y="110" width="260" height="56" rx="28"/>
      <rect x="290" y="200" width="260" height="56" rx="28"/>
      <rect x="290" y="290" width="260" height="56" rx="28"/>
    </g>
    <g fill="#f0f6fc" text-anchor="middle">
      <text x="420" y="44">¿La operación involucra</text>
      <text x="420" y="63">múltiples herramientas?</text>
      <text x="420" y="134">¿Necesita rastrear</text>
      <text x="420" y="153">dependencias entre archivos?</text>
      <text x="420" y="224">¿El equipo ya usa</text>
      <text x="420" y="243">un task runner propio?</text>
      <text x="420" y="314">¿Lógica compleja</text>
      <text x="420" y="333">con muchos condicionales?</text>
    </g>

    <!-- "no" hacia abajo -->
    <g stroke="#8b949e" stroke-width="2">
      <line x1="420" y1="76" x2="420" y2="108" marker-end="url(#arrow)"/>
      <line x1="420" y1="166" x2="420" y2="198" marker-end="url(#arrow)"/>
      <line x1="420" y1="256" x2="420" y2="288" marker-end="url(#arrow)"/>
      <line x1="420" y1="346" x2="420" y2="418" marker-end="url(#arrow)"/>
    </g>
    <g fill="#8b949e" font-size="12">
      <text x="428" y="97">no</text>
      <text x="428" y="187">no</text>
      <text x="428" y="277">no hay convención</text>
      <text x="428" y="386">sí, muchas ramas</text>
    </g>

    <!-- hacia Make -->
    <g stroke="#8b949e" stroke-width="2">
      <line x1="550" y1="48" x2="598" y2="48" marker-end="url(#arrow)"/>
      <line x1="550" y1="138" x2="598" y2="138" marker-end="url(#arrow)"/>
      <line x1="550" y1="318" x2="598" y2="318" marker-end="url(#arrow)"/>
      <line x1="290" y1="228" x2="252" y2="228" marker-end="url(#arrow)"/>
    </g>
    <g fill="#8b949e" font-size="12" text-anchor="middle">
      <text x="572" y="40">sí</text>
      <text x="572" y="130">sí</text>
      <text x="572" y="310">no</text>
      <text x="271" y="220">sí</text>
    </g>

    <!-- Make -->
    <rect x="600" y="20" width="180" height="326" rx="6" fill="#161b22" stroke="#f78166" stroke-width="2"/>
    <text x="690" y="160" fill="#f78166" text-anchor="middle" font-weight="600">Usar Make</text>
    <g fill="#f0f6fc" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      <text x="690" y="190">make test</text>
      <text x="690" y="212">make build</text>
      <text x="690" y="234">make deploy</text>
    </g>

    <!-- herramienta nativa -->
    <rect x="20" y="174" width="230" height="108" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="135" y="200" fill="#58a6ff" text-anchor="middle" font-weight="600">Herramienta nativa</text>
    <g fill="#f0f6fc" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      <text x="135" y="226">pnpm test</text>
      <text x="135" y="248">tox</text>
      <text x="135" y="270">invoke build</text>
    </g>

    <!-- script -->
    <rect x="290" y="420" width="260" height="96" rx="6" fill="#161b22" stroke="#d2a8ff" stroke-width="2"/>
    <text x="420" y="446" fill="#d2a8ff" text-anchor="middle" font-weight="600">Script shell o Python</text>
    <text x="420" y="472" fill="#f0f6fc" text-anchor="middle"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace">./scripts/deploy.sh</text>
    <text x="420" y="497" fill="#8b949e" text-anchor="middle" font-size="13">llamado desde Make</text>
  </g>
</svg>
